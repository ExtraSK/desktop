        const cards=WALLPAPERS.map(w=>`<button class="wpc" data-wp="${w.id}" title="${w.name}"><span class="th" style="${esc('background-image:'+w.image+';background-color:'+w.color)}"></span>${w.name}</button>`).join('');
        const custom=customWp?`<button class="wpc" data-wp="custom" title="Custom image"><span class="th" style="${esc('background-image:url("'+customWp+'")')}"></span>Custom image</button>`:'';
        return head('Personalization','Choose the wallpaper that appears on your desktop and lock screen.')+`<h2>Wallpaper</h2><div class="wps">${cards}${custom}</div><h2>Options</h2>`+rng('dim','Dim wallpaper','Darken the wallpaper behind icons and windows',0,70,'%')+`<div class="row"><div class="rl"><b>Use your own image</b><span>Images are resized and stored in this browser</span></div><div class="btns"><button class="btn" data-act="upload">${icon('upload',15)} Choose image</button>${customWp?`<button class="btn" data-act="rmimg">Remove</button>`:''}</div></div>`;
      },
      appearance(){
        return head('Appearance','Tune colors and surfaces across the whole interface.')+`<h2>Theme</h2>`+seg('theme','Color mode','Light, dark, or follow your system',[['dark','Dark'],['light','Light'],['system','System']])+`<h2>Accent color</h2><div class="row"><div class="sws">${ACC.map(c=>`<button class="swc" data-ac="${c}" style="background:${c}" title="${c}"></button>`).join('')}<input type="color" class="st-color" id="ac-custom" title="Custom color"></div></div><h2>Interface</h2>`+rng('glass','Window opacity','Lower values show more of the wallpaper through windows',40,100,'%')+rng('radius','Corner radius','Roundness of windows and panels',0,24,'px')+sw('animations','Animations','Opening, closing and minimizing transitions');
      },
      desktop(){
        return head('Desktop','Control how icons behave on the desktop.')+sw('showIcons','Show desktop icons','Hide or reveal every icon on the desktop')+sw('snap','Snap icons to grid','Align icons neatly when you drop them')+seg('iconSize','Icon size','Size of icons on the desktop',[['sm','Small'],['md','Medium'],['lg','Large']])+`<div class="row"><div class="rl"><b>Reset icon positions</b><span>Return every icon to its default place</span></div><button class="btn" data-act="resetIcons">Reset</button></div>`;
      },
      clock(){
        return head('Clock','Choose how time and date appear in the taskbar.')+`<div class="clock-prev" id="clock-prev"></div><div class="sub" id="date-prev"></div>`+seg('clock24','Time format','12 hour or 24 hour clock',[['false','12 hour'],['true','24 hour']])+sw('seconds','Show seconds','Include seconds in the taskbar clock')+sw('showDate','Show date','Display the date under the time');
      },
      system(){
        const files=Object.values(fs.nodes).filter(n=>n.type==='file'&&!fs.isTrashed(n.id)).length;
        return head('System','Account, connectivity and data.')+`<h2>Account</h2><div class="row"><div class="rl"><b>User name</b><span>Shown on the lock screen and in the terminal</span></div><input class="field" id="st-user" maxlength="20" spellcheck="false" style="width:180px"></div><h2>Quick settings</h2>`+sw('wifi','Wi-Fi','Required to reach addresses outside this device in the Browser')+sw('dnd','Quiet mode','Silence notification pop ups')+sw('night','Night light','Apply a warmer tint to the display')+rng('volume','Volume','Master volume for the Music player',0,100,'%')+rng('brightness','Brightness','Display brightness',20,100,'%')+`<h2>About</h2><dl class="kv"><dt>System</dt><dd>DESKTOP 1.0</dd><dt>Files</dt><dd>${files}</dd><dt>Notes</dt><dd>${notes.length}</dd><dt>Storage used</dt><dd>${fmtBytes(store.bytes())}</dd></dl><h2>Data</h2><div class="row"><div class="rl"><b>Backup</b><span>Export or restore everything stored by DESKTOP</span></div><div class="btns"><button class="btn" data-act="export">${icon('download',15)} Export</button><button class="btn" data-act="import">${icon('upload',15)} Import</button></div></div><div class="row"><div class="rl"><b>Reset DESKTOP</b><span>Delete all files, notes and settings, then restart</span></div><button class="btn danger" data-act="reset">Reset</button></div>`;
      }
    };
    function sync(){
      $$('[data-sw]',main).forEach(b=>b.classList.toggle('on',!!S[b.dataset.sw]));
      $$('[data-seg]',main).forEach(g=>$$('button',g).forEach(b=>b.classList.toggle('on',String(S[g.dataset.seg])===b.dataset.v)));
      $$('[data-rg]',main).forEach(r=>{
        if(document.activeElement!==r)r.value=S[r.dataset.rg];
        rangeFill(r);
        r.parentElement.querySelector('.rv').textContent=r.value+r.dataset.unit;
      });
      $$('[data-wp]',main).forEach(c=>c.classList.toggle('on',S.wallpaper===c.dataset.wp));
      $$('[data-ac]',main).forEach(c=>c.classList.toggle('on',S.accent.toLowerCase()===c.dataset.ac));
      const cc=$('#ac-custom',main);
      if(cc)cc.value=S.accent;
      clockTick();
    }
    function clockTick(){
      const cp=$('#clock-prev',main);
      if(cp){const d=new Date();cp.textContent=fmtClock(d,S.seconds);$('#date-prev',main).textContent=d.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric',year:'numeric'})}
    }
    function showPage(p){
      page=p;
      $$('.st-nav button',root).forEach(b=>b.classList.toggle('on',b.dataset.page===p));
      main.innerHTML=builders[p]();
      initRanges(main);
      const u=$('#st-user',main);
      if(u)u.value=S.username;
      sync();
      main.scrollTop=0;
    }
    win.showPage=showPage;
    root.addEventListener('click',async e=>{
      const nav=e.target.closest('[data-page]');
      if(nav){showPage(nav.dataset.page);return}
      const swt=e.target.closest('[data-sw]');
      if(swt){setS({[swt.dataset.sw]:!S[swt.dataset.sw]});sync();return}
      const sg=e.target.closest('[data-seg] button');
      if(sg){
        const k=sg.parentElement.dataset.seg,v=sg.dataset.v;
        setS({[k]:v==='true'?true:v==='false'?false:v});sync();return;
      }
      const wp=e.target.closest('[data-wp]');
      if(wp){setS({wallpaper:wp.dataset.wp});sync();return}
      const ac=e.target.closest('[data-ac]');
      if(ac){setS({accent:ac.dataset.ac});sync();return}
      const act=e.target.closest('[data-act]');
      if(!act)return;
      const a=act.dataset.act;
      if(a==='upload')$('#st-img',win.body).click();
      else if(a==='rmimg'){
        customWp=null;store.set('customwp',null);
        if(S.wallpaper==='custom')setS({wallpaper:'dusk'});
        showPage('personalization');
      }else if(a==='resetIcons'){
        iconPos={};store.set('icons',iconPos);renderIcons();
        toast({title:'Icons reset',msg:'Desktop icons are back in their default places.',icon:'grid'});
      }else if(a==='export'){
        const o={};
        store.keys().forEach(k=>{o[k]=localStorage.getItem(k)});
        const blob=new Blob([JSON.stringify(o,null,2)],{type:'application/json'});
        const l=document.createElement('a');
        l.href=URL.createObjectURL(blob);l.download='desktop-backup.json';
        document.body.appendChild(l);l.click();l.remove();
        setTimeout(()=>URL.revokeObjectURL(l.href),1000);
        toast({title:'Backup exported',icon:'download'});
      }else if(a==='import')$('#st-imp',win.body).click();
      else if(a==='reset'){
        if(await confirmBox('Reset DESKTOP','Every file, note, bookmark and setting will be erased and the system will restart.','Reset everything')){
          store.clear();
          location.reload();
        }
      }
    });
    root.addEventListener('input',e=>{
      const r=e.target.closest('[data-rg]');
      if(r){setS({[r.dataset.rg]:+r.value});r.parentElement.querySelector('.rv').textContent=r.value+r.dataset.unit}
      else if(e.target.id==='ac-custom')setS({accent:e.target.value});
    });
    root.addEventListener('change',e=>{
      if(e.target.id==='st-user'){
        const v=e.target.value.trim().slice(0,20)||'user';
        e.target.value=v;
        setS({username:v});
      }else if(e.target.id==='ac-custom')sync();
    });
    $('#st-img',win.body).addEventListener('change',e=>{
      const f=e.target.files[0];
      e.target.value='';
      if(!f)return;
      const fr=new FileReader();
      fr.onload=()=>{
        const img=new Image();
        img.onload=()=>{
          const sc=Math.min(1,1920/img.width);
          const c=document.createElement('canvas');
          c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
          c.getContext('2d').drawImage(img,0,0,c.width,c.height);
          const url=c.toDataURL('image/jpeg',.82);
          if(!store.set('customwp',url)){toast({title:'Image too large',msg:'Browser storage is full. Try a smaller image.',icon:'info',force:true});return}
          customWp=url;
          setS({wallpaper:'custom'});
          wpKey='';applyWallpaper();
          showPage('personalization');
        };
        img.onerror=()=>toast({title:'Could not read image',icon:'info',force:true});
        img.src=fr.result;
      };
      fr.readAsDataURL(f);
    });
    $('#st-imp',win.body).addEventListener('change',e=>{
      const f=e.target.files[0];
      e.target.value='';
      if(!f)return;
      const fr=new FileReader();
      fr.onload=()=>{
        try{
          const o=JSON.parse(fr.result);
          const keys=Object.keys(o).filter(k=>k.startsWith('desktop.'));
          if(!keys.length)throw new Error('empty');
          store.clear();
          keys.forEach(k=>localStorage.setItem(k,o[k]));
          location.reload();
        }catch(err){toast({title:'Invalid backup file',icon:'info',force:true})}
      };
      fr.readAsText(f);
    });
    win.listen('settings',sync);
    const iv=setInterval(clockTick,1000);
    win.onClose(()=>clearInterval(iv));
    showPage(page);
  }
};
</script>
<script>
function startMatrix(){
  if($('#matrix'))return;
  const c=document.createElement('canvas');
  c.id='matrix';
  c.width=innerWidth;c.height=innerHeight;
  $('#os').appendChild(c);
  const ctx=c.getContext('2d'),size=16,cols=Math.ceil(c.width/size);
  const drops=Array.from({length:cols},()=>Math.random()*-40);
  const chars='01ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz<>/+=*';
  let raf=0,last=0,done=false;
  const draw=ts=>{
    raf=requestAnimationFrame(draw);
    if(ts-last<48)return;
    last=ts;
    ctx.fillStyle='rgba(0,0,0,.09)';
    ctx.fillRect(0,0,c.width,c.height);
    ctx.font=size+'px monospace';
    drops.forEach((y,i)=>{
      ctx.fillStyle=Math.random()>.96?'#eafff2':'#2fd37c';
      ctx.fillText(chars[Math.floor(Math.random()*chars.length)],i*size,y*size);
      if(y*size>c.height&&Math.random()>.975)drops[i]=0;
      drops[i]++;
    });
  };
  const stop=()=>{
    if(done)return;
    done=true;
    cancelAnimationFrame(raf);
    document.removeEventListener('keydown',onKey,true);
    c.style.transition='opacity .5s';
    c.style.opacity='0';
    setTimeout(()=>c.remove(),520);
  };
  const onKey=e=>{if(e.key==='Escape')stop()};
  document.addEventListener('keydown',onKey,true);
  c.addEventListener('click',stop);
  setTimeout(stop,9000);
  raf=requestAnimationFrame(draw);
}

function hslHex(hh,s,l){
  s/=100;l/=100;
  const k=n=>(n+hh/30)%12,a=s*Math.min(l,1-l);
  const f=n=>Math.round(255*(l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)))));
  return '#'+[f(0),f(8),f(4)].map(v=>v.toString(16).padStart(2,'0')).join('');
}
let partyOn=false;
function partyMode(){
  if(partyOn)return;
  partyOn=true;
  const orig=S.accent;
  let hh=0,n=0;
  toast({title:'Party mode',msg:'Enjoy the colors while they last.',icon:'palette',force:true});
  const iv=setInterval(()=>{
    hh=(hh+8)%360;n++;
    S.accent=hslHex(hh,78,64);
    applySettings();
    if(n>110){clearInterval(iv);S.accent=orig;applySettings();partyOn=false}
  },60);
}

(function(){
  let clicks=0,timer=null;
  document.addEventListener('click',e=>{
    if(e.target.closest('#start-avatar')){
      clicks++;
      clearTimeout(timer);
      timer=setTimeout(()=>clicks=0,1500);
      if(clicks>=5){clicks=0;partyMode()}
    }
  });
  let logoClicks=0;
  $('#boot-logo').addEventListener('click',()=>{
    logoClicks++;
    if(logoClicks>=5){$('#boot-status').textContent='Hello there, curious one.';logoClicks=0}
  });
  const code=['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
  let pos=0;
  document.addEventListener('keydown',e=>{
    if(sys.locked)return;
    const k=e.key.length===1?e.key.toLowerCase():e.key;
    if(k===code[pos]){
      pos++;
      if(pos===code.length){pos=0;toast({title:'Cheat code accepted',msg:'Press Escape to wake up.',icon:'terminal',force:true});startMatrix()}
    }else pos=k===code[0]?1:0;
  });
  let tClicks=0,tTimer=null;
  $('#lock-time').addEventListener('click',e=>{
    e.stopPropagation();
    tClicks++;
    clearTimeout(tTimer);
    tTimer=setTimeout(()=>tClicks=0,1200);
    if(tClicks>=3){tClicks=0;setS({seconds:!S.seconds});$('#lock-date').textContent=S.seconds?'Seconds are now visible in the taskbar clock':'Seconds are now hidden'}
  });
  document.addEventListener('keydown',e=>{
    if(sys.locked||wm.active||menuEl||$('#modal-root').children.length)return;
    if(e.target.closest&&e.target.closest('input,textarea'))return;
    if(!iconSel)return;
    if(e.key==='Enter'){openDesktopItem(iconSel)}
    else if(iconSel.startsWith('fs:')){
      const n=fs.get(iconSel.slice(3));
      if(!n)return;
      if(e.key==='F2'){e.preventDefault();renameDesktopNode(n)}
      else if(e.key==='Delete')trashNode(n);
    }
  });
})();

applySettings();
buildStart();
buildQuick();
buildCalendar();
renderTray();
renderTaskbar();
renderIcons();
tick();
setInterval(tick,1000);
startBoot();
</script>
