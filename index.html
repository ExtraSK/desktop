<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
:root{
  --accent:#8b7cf6;
  --accent-rgb:139,124,246;
  --accent-soft:rgba(139,124,246,.2);
  --on-accent:#fff;
  --glass:.78;
  --blur:26px;
  --radius:14px;
  --tb:56px;
  --anim:1;
  --dur:calc(.22s * var(--anim));
  --ease:cubic-bezier(.2,.8,.2,1);
  --isz:48px;
  --iw:92px;
  --ih:100px;
  --dim:0;
  --font:"Inter","SF Pro Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono","SF Mono","Cascadia Code",ui-monospace,Menlo,Consolas,monospace;
  --wp:none;
  --wp-color:#0b0b18;
}
html[data-theme=dark]{
  color-scheme:dark;
  --text:#ececf6;
  --muted:#a0a0ba;
  --faint:#6f6f8a;
  --win:rgba(21,21,31,var(--glass));
  --bar:rgba(14,14,22,calc(var(--glass) + .12));
  --menu:rgba(24,24,36,.94);
  --surface:rgba(255,255,255,.045);
  --surface-2:rgba(255,255,255,.085);
  --surface-3:rgba(255,255,255,.14);
  --border:rgba(255,255,255,.085);
  --input:rgba(0,0,0,.26);
  --shadow:0 28px 70px rgba(0,0,0,.5),0 2px 10px rgba(0,0,0,.35);
  --page:#d9d9ea;
  --page-line:#8f8fae;
  --accent-strong:color-mix(in srgb,var(--accent) 68%,white);
}
html[data-theme=light]{
  color-scheme:light;
  --text:#1b1b29;
  --muted:#5d5d78;
  --faint:#8c8ca4;
  --win:rgba(247,247,252,var(--glass));
  --bar:rgba(244,244,250,calc(var(--glass) + .1));
  --menu:rgba(251,251,255,.96);
  --surface:rgba(0,0,0,.035);
  --surface-2:rgba(0,0,0,.07);
  --surface-3:rgba(0,0,0,.12);
  --border:rgba(0,0,0,.1);
  --input:rgba(255,255,255,.7);
  --shadow:0 24px 60px rgba(30,30,60,.22),0 2px 8px rgba(30,30,60,.12);
  --page:#ffffff;
  --page-line:#b3b3c9;
  --accent-strong:color-mix(in srgb,var(--accent) 78%,black);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#05050a;font-family:var(--font);font-size:14px;color:var(--text);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;cursor:default;line-height:1.4}
input,textarea{user-select:text;-webkit-user-select:text;font-family:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:default;text-align:inherit}
svg{display:block;flex:none}
*{scrollbar-width:thin;scrollbar-color:rgba(128,128,160,.35) transparent}
.hidden{display:none!important}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
@keyframes winIn{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
@keyframes bounce{0%,100%{transform:translateY(0)}35%{transform:translateY(-9px)}65%{transform:translateY(-2px)}}
@keyframes bootPulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 18px rgba(139,124,246,.35))}50%{transform:scale(1.05);filter:drop-shadow(0 0 30px rgba(79,140,255,.55))}}
@keyframes bars{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}

#os{position:fixed;inset:0;overflow:hidden}
#desktop{position:absolute;inset:0}
#wallpaper{position:absolute;inset:0;background-color:var(--wp-color);background-image:var(--wp);background-size:cover;background-position:center}
#wallpaper.fade{animation:fade .7s ease}
#wallpaper-dim{position:absolute;inset:0;background:#000;opacity:var(--dim);pointer-events:none}
#icons{position:absolute;left:0;right:0;top:0;bottom:var(--tb);overflow:hidden}
#icons.fadein{animation:fade .35s ease}
#windows{position:absolute;left:0;right:0;top:0;bottom:var(--tb);pointer-events:none}
#windows>.win{pointer-events:auto}
#snap-preview{position:absolute;border-radius:14px;background:rgba(var(--accent-rgb),.16);border:2px solid rgba(var(--accent-rgb),.55);opacity:0;pointer-events:none;transition:all .15s ease;z-index:9500}

.appicon{display:grid;place-items:center;border-radius:26%;color:#fff;background:linear-gradient(150deg,color-mix(in srgb,var(--c) 82%,#fff),var(--c));box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(0,0,0,.18),0 3px 10px rgba(0,0,0,.28);flex:none}

.dicon{position:absolute;width:var(--iw);height:var(--ih);display:flex;flex-direction:column;align-items:center;gap:6px;padding:7px 4px;border-radius:10px;border:1px solid transparent;touch-action:none;transition:left .18s ease,top .18s ease,background .12s}
.dicon:hover{background:rgba(255,255,255,.08)}
.dicon.sel{background:rgba(var(--accent-rgb),.28);border-color:rgba(var(--accent-rgb),.6)}
.dicon.moving{transition:none;z-index:5;opacity:.88}
.dicon.target{outline:2px dashed rgba(255,255,255,.7)}
.dicon-ic{width:var(--isz);height:var(--isz);display:grid;place-items:center;filter:drop-shadow(0 4px 8px rgba(0,0,0,.35));flex:none}
.dicon-ic svg.big{width:100%;height:100%}
.dicon-name{font-size:12px;line-height:1.25;color:#fff;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.85),0 0 10px rgba(0,0,0,.45);max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}

.win{position:absolute;display:flex;flex-direction:column;background:var(--win);backdrop-filter:blur(var(--blur)) saturate(1.4);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.4);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;transform-origin:center;animation:winIn var(--dur) var(--ease);transition:transform var(--dur) var(--ease),opacity var(--dur) var(--ease),box-shadow .2s}
.win.animating{transition:transform var(--dur) var(--ease),opacity var(--dur) var(--ease),left var(--dur) var(--ease),top var(--dur) var(--ease),width var(--dur) var(--ease),height var(--dur) var(--ease),border-radius var(--dur)}
.win:not(.focused){box-shadow:0 12px 36px rgba(0,0,0,.28)}
.win:not(.focused) .win-title{opacity:.72}
.win.focused{border-color:rgba(var(--accent-rgb),.28)}
.win.max{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0;border-color:transparent}
.win.snapped{border-radius:0}
.win.min{display:none}
.win.minimizing{transform:translate(var(--tx),var(--ty)) scale(.2);opacity:0;pointer-events:none}
.win.closing{opacity:0;transform:scale(.95);pointer-events:none;animation:none}
.win-title{height:40px;flex:none;display:flex;align-items:center;gap:10px;padding-left:12px;border-bottom:1px solid var(--border);background:rgba(128,128,160,.05);touch-action:none;transition:opacity .2s}
.win-ic{display:flex}
.win-name{flex:1;min-width:0;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win-ctrls{display:flex;height:100%}
.wc{width:46px;height:100%;display:grid;place-items:center;color:var(--muted);transition:background .12s,color .12s}
.wc:hover{background:var(--surface-2);color:var(--text)}
.wc.close:hover{background:#e5484d;color:#fff}
.win-body{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;overflow:hidden}
.rz{position:absolute;z-index:6;display:block}
.rz-n{top:0;left:12px;right:12px;height:4px;cursor:ns-resize}
.rz-s{bottom:0;left:12px;right:12px;height:6px;cursor:ns-resize}
.rz-e{right:0;top:12px;bottom:12px;width:6px;cursor:ew-resize}
.rz-w{left:0;top:12px;bottom:12px;width:6px;cursor:ew-resize}
.rz-ne{top:0;right:0;width:14px;height:14px;cursor:nesw-resize}
.rz-nw{top:0;left:0;width:14px;height:14px;cursor:nwse-resize}
.rz-se{bottom:0;right:0;width:14px;height:14px;cursor:nwse-resize}
.rz-sw{bottom:0;left:0;width:14px;height:14px;cursor:nesw-resize}
.win.max .rz,.win.snapped .rz-n,.win.snapped .rz-s{display:none}

#taskbar{position:fixed;left:0;right:0;bottom:0;height:var(--tb);z-index:10000;display:flex;align-items:center;justify-content:space-between;padding:0 6px 0 14px;background:var(--bar);backdrop-filter:blur(var(--blur)) saturate(1.5);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.5);border-top:1px solid var(--border)}
#tb-left{flex:1 1 0;min-width:0;display:flex;align-items:center}
#tb-apps{display:flex;gap:4px;align-items:center}
#tb-tray{flex:1 1 0;min-width:0;display:flex;justify-content:flex-end;align-items:center;gap:2px}
.tb-btn{position:relative;width:46px;height:42px;border-radius:10px;display:grid;place-items:center;transition:background .15s,transform .12s}
.tb-btn:hover{background:var(--surface-2)}
.tb-btn:active{transform:scale(.92)}
.tb-btn::after{content:"";position:absolute;bottom:1px;left:50%;width:0;height:3px;border-radius:3px;background:var(--faint);transform:translateX(-50%);transition:width .2s,background .2s}
.tb-btn.running::after{width:5px}
.tb-btn.active::after{width:16px;background:var(--accent)}
.tb-btn.bounce{animation:bounce .5s ease}
.tb-btn.start-btn{color:var(--accent)}
.tb-btn.start-btn.open{background:var(--surface-2)}
.tb-btn.start-btn::after{display:none}
.tray-btn{height:40px;padding:0 10px;border-radius:10px;display:flex;align-items:center;gap:10px;transition:background .15s}
.tray-btn:hover,.tray-btn.open{background:var(--surface-2)}
.tray-btn svg{color:var(--text)}
.clock{flex-direction:column;align-items:flex-end;justify-content:center;gap:0;font-size:12px;line-height:1.3;text-align:right;padding:0 10px}
.clock b{font-weight:500}
.clock span{color:var(--muted)}
.show-desktop{width:8px;height:100%;margin-left:4px;border-left:1px solid var(--border);transition:background .15s}
.show-desktop:hover{background:var(--surface-2)}
.np{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px 0 10px;border-radius:10px;max-width:260px;transition:background .15s}
.np:hover{background:var(--surface-2)}
.np-bars{display:flex;align-items:flex-end;gap:2px;height:16px}
.np-bars i{display:block;width:3px;height:100%;border-radius:2px;background:var(--accent);transform-origin:bottom;animation:bars .9s ease-in-out infinite}
.np-bars i:nth-child(2){animation-delay:.2s}
.np-bars i:nth-child(3){animation-delay:.45s}
.np-t{display:flex;flex-direction:column;min-width:0;font-size:12px;line-height:1.25}
.np-t b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.np-t span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.panel{position:fixed;z-index:10010;bottom:calc(var(--tb) + 12px);background:var(--menu);backdrop-filter:blur(calc(var(--blur) + 12px)) saturate(1.5);-webkit-backdrop-filter:blur(calc(var(--blur) + 12px)) saturate(1.5);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);opacity:0;transform:translateY(16px) scale(.98);pointer-events:none;transform-origin:bottom center;transition:opacity var(--dur) ease,transform var(--dur) var(--ease);overflow:hidden}
.panel.open{opacity:1;transform:none;pointer-events:auto}
#start{left:max(8px,calc(50% - 310px));width:min(620px,calc(100vw - 16px));max-height:calc(100vh - var(--tb) - 24px);display:flex;flex-direction:column}
#calendar{right:12px;width:min(340px,calc(100vw - 24px));transform-origin:bottom right}
#quick{right:12px;width:min(368px,calc(100vw - 24px));transform-origin:bottom right}
.start-search{margin:18px 18px 6px;height:42px;border-radius:12px;background:var(--input);border:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--muted)}
.start-search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.start-search input{flex:1;background:none;border:0;outline:0;color:var(--text);font-size:14px}
#start-body{flex:1;min-height:0;overflow:auto;padding-bottom:12px}
.sec-title{padding:12px 26px 6px;font-size:12px;font-weight:600;color:var(--muted)}
.start-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:0 16px}
.start-app{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 2px 10px;border-radius:12px;font-size:12px;transition:background .15s,transform .12s}
.start-app:hover{background:var(--surface-2)}
.start-app:active{transform:scale(.95)}
.rec-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:0 16px}
.rec{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:10px;min-width:0}
.rec:hover,.rec.first{background:var(--surface-2)}
.rec-ic{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;background:var(--surface-2);color:var(--accent-strong);flex:none}
.rec-ic svg.big{width:22px;height:22px}
.rec-t{display:flex;flex-direction:column;min-width:0;font-size:13px;line-height:1.3}
.rec-t b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec-t span{color:var(--muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res-list{padding:0 16px;display:flex;flex-direction:column;gap:2px}
.empty-note{padding:14px 12px;color:var(--faint);font-size:13px}
.start-foot{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-top:1px solid var(--border);background:rgba(0,0,0,.1)}
.user-chip{display:flex;align-items:center;gap:10px;padding:6px 10px 6px 6px;border-radius:10px;font-size:13px}
.user-chip:hover{background:var(--surface-2)}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;background:linear-gradient(140deg,var(--accent),#4f8cff);color:#fff;text-transform:uppercase;flex:none}
.pw{display:flex;gap:2px}
.q-tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:16px 16px 8px}
.q-tile{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--surface-2);transition:background .15s,color .15s,transform .1s;min-width:0}
.q-tile:active{transform:scale(.97)}
.q-tile.on{background:var(--accent);color:var(--on-accent)}
.q-tile .qt{display:flex;flex-direction:column;font-size:13px;line-height:1.25;min-width:0}
.q-tile .qt b{font-weight:500}
.q-tile .qt span{font-size:11.5px;opacity:.75}
.q-sliders{padding:8px 18px 4px;display:flex;flex-direction:column;gap:8px}
.q-row{display:flex;align-items:center;gap:10px}
.q-row .ibtn,.q-ic{width:32px;height:32px;display:grid;place-items:center;color:var(--muted);flex:none}
.q-val{width:34px;text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.q-foot{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 10px 18px;margin-top:6px;border-top:1px solid var(--border);background:rgba(0,0,0,.1);font-size:12.5px;color:var(--muted)}
.q-batt{display:flex;align-items:center;gap:8px}
.cal-head{padding:18px 20px 12px}
.cal-time{font-size:34px;font-weight:300;letter-spacing:-.02em}
.cal-date{color:var(--muted);font-size:13px;margin-top:2px}
.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-top:1px solid var(--border)}
.cal-nav b{font-weight:500;font-size:13.5px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:4px 14px 12px;text-align:center}
.cal-grid .wd{font-size:11px;color:var(--faint);padding:6px 0}
.cal-d{height:34px;border-radius:50%;font-size:12.5px;display:grid;place-items:center;transition:background .12s}
.cal-d:hover{background:var(--surface-2)}
.cal-d.sel{background:var(--surface-3)}
.cal-d.today{background:var(--accent);color:var(--on-accent);font-weight:600}
.cal-d.blank{pointer-events:none}
.cal-foot{padding:8px 14px 14px;display:flex;justify-content:flex-end}

.btn{height:32px;padding:0 14px;border-radius:9px;background:var(--surface-2);border:1px solid var(--border);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:13px;white-space:nowrap;transition:background .15s,transform .1s,filter .15s}
.btn:hover{background:var(--surface-3)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.danger{background:#d9444a;border-color:transparent;color:#fff}
.btn.danger:hover{filter:brightness(1.1)}
.btn.disabled,.btn:disabled{opacity:.4;pointer-events:none}
.ibtn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted);transition:background .12s,color .12s;flex:none}
.ibtn:hover{background:var(--surface-2);color:var(--text)}
.ibtn.disabled{opacity:.35;pointer-events:none}
.ibtn.on{background:var(--accent-soft);color:var(--accent-strong)}
.field{height:32px;padding:0 10px;border-radius:9px;background:var(--input);border:1px solid var(--border);color:var(--text);font-size:13px;outline:0;min-width:0}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field::placeholder{color:var(--faint)}
.switch{position:relative;width:40px;height:22px;border-radius:22px;background:var(--surface-3);transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .2s var(--ease)}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(18px)}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--input);border:1px solid var(--border);gap:2px}
.seg button{padding:5px 13px;border-radius:7px;font-size:13px;color:var(--muted);transition:background .15s,color .15s}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--accent);color:var(--on-accent)}
input[type=range].range{-webkit-appearance:none;appearance:none;height:18px;background:transparent;width:100%;margin:0;--p:50%}
input[type=range].range:focus{outline:0}
input[type=range].range::-webkit-slider-runnable-track{height:5px;border-radius:5px;background:linear-gradient(to right,var(--accent) var(--p),var(--surface-3) var(--p))}
input[type=range].range::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;margin-top:-5.5px;box-shadow:0 1px 4px rgba(0,0,0,.45);border:0}
input[type=range].range::-moz-range-track{height:5px;border-radius:5px;background:var(--surface-3)}
input[type=range].range::-moz-range-progress{height:5px;border-radius:5px;background:var(--accent)}
input[type=range].range::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:#fff}

.menu{position:fixed;z-index:10050;min-width:208px;max-width:280px;padding:6px;background:var(--menu);backdrop-filter:blur(30px) saturate(1.5);-webkit-backdrop-filter:blur(30px) saturate(1.5);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);animation:pop .14s var(--ease)}
.menu-item{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:8px;font-size:13px;white-space:nowrap}
.menu-item:hover{background:var(--accent-soft)}
.menu-item.danger{color:#ff6b72}
.menu-item.disabled{opacity:.4;pointer-events:none}
.menu-item svg{color:var(--muted)}
.menu-item.danger svg{color:#ff6b72}
.mi-gap{width:15px;flex:none}
.mi-l{flex:1}
.mi-s{color:var(--faint);font-size:12px;margin-left:18px}
.menu-sep{height:1px;background:var(--border);margin:5px 6px}

.modal-back{position:fixed;inset:0;z-index:10070;display:grid;place-items:center;background:rgba(0,0,0,.38);animation:fade .15s ease}
.modal-back.out{opacity:0;transition:opacity .15s}
.modal{width:min(390px,calc(100vw - 32px));background:var(--menu);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);animation:pop .2s var(--ease)}
.modal-title{font-weight:600;font-size:15px;margin-bottom:6px}
.modal-msg{color:var(--muted);font-size:13px;line-height:1.5;margin-bottom:6px}
.modal-input{width:100%;margin-top:8px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}

#toasts{position:fixed;right:14px;top:14px;z-index:10060;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;width:330px;max-width:calc(100vw - 28px);display:flex;gap:12px;padding:12px 14px;background:var(--menu);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);animation:pop .3s var(--ease);transition:opacity .25s,transform .25s}
.toast.out{opacity:0;transform:translateX(24px)}
.toast .t-ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-strong);flex:none}
.toast .t-b{display:flex;flex-direction:column;min-width:0;font-size:13px;line-height:1.4}
.toast .t-b b{font-weight:600}
.toast .t-b span{color:var(--muted)}

#night{position:fixed;inset:0;background:#ffb25e;mix-blend-mode:multiply;opacity:0;pointer-events:none;z-index:20000;transition:opacity .5s}
#dimmer{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:20001;transition:opacity .2s}
#matrix{position:fixed;inset:0;z-index:15000;background:rgba(0,0,0,.86);animation:fade .4s}

#lock{position:fixed;inset:0;z-index:30000;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:13vh 24px 8vh;color:#fff;text-align:center;transition:transform .75s cubic-bezier(.7,0,.2,1),opacity .75s}
#lock.unlocking{transform:translateY(-100%);opacity:0}
.lock-bg{position:absolute;inset:-24px;background-color:var(--wp-color);background-image:var(--wp);background-size:cover;background-position:center;filter:blur(16px) brightness(.62) saturate(1.1);z-index:-1}
.lock-time{font-size:clamp(76px,17vw,160px);font-weight:200;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 8px 40px rgba(0,0,0,.35)}
.lock-date{font-size:clamp(16px,2.6vw,22px);opacity:.85;margin-top:12px}
.lock-bottom{display:flex;flex-direction:column;align-items:center;gap:10px}
.lock-avatar{width:68px;height:68px;font-size:26px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(140deg,var(--accent),#4f8cff);font-weight:600;text-transform:uppercase;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.lock-name{font-size:18px;font-weight:500}
.lock-btn{margin-top:8px;height:42px;padding:0 28px;border-radius:21px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(14px);font-size:14px;font-weight:500;transition:background .2s,transform .12s}
.lock-btn:hover{background:rgba(255,255,255,.26)}
.lock-btn:active{transform:scale(.96)}
.lock-hint{font-size:12px;opacity:.6}
.lock-status{position:absolute;right:22px;top:20px;display:flex;gap:12px;align-items:center;opacity:.85}

#boot{position:fixed;inset:0;z-index:40000;background:#07070c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;transition:opacity .7s ease;color:#c9c9e6}
#boot.done{opacity:0;pointer-events:none}
#boot-logo{animation:bootPulse 2.6s ease-in-out infinite}
.boot-word{letter-spacing:.55em;margin-right:-.55em;font-weight:600;font-size:14px}
.boot-bar{width:190px;height:3px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.boot-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8b7cf6,#4f8cff);border-radius:3px}
.boot-status{font-size:12px;color:#6f6f8a;height:16px}
#off{position:fixed;inset:0;z-index:50000;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#6f6f8a;font-size:13px;animation:fade .6s}
#off button{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(255,255,255,.14);color:#a0a0ba;transition:all .2s}
#off button:hover{color:#fff;border-color:#8b7cf6;box-shadow:0 0 30px rgba(139,124,246,.4)}

@media (max-width:640px){
  :root{--tb:52px}
  #tb-left{display:none}
  #taskbar{padding:0 2px 0 6px}
  #tb-apps{flex:1;overflow-x:auto;justify-content:flex-start;scrollbar-width:none}
  #tb-tray{flex:none}
  .tb-btn{width:40px;flex:none}
  .tray-sys .hide-sm{display:none}
  .tray-btn{padding:0 6px}
  .show-desktop{display:none}
  .start-grid{grid-template-columns:repeat(4,1fr)}
  .rec-grid{grid-template-columns:1fr}
}

function hexRgb(hex){
  let x=hex.replace('#','');
  if(x.length===3)x=x.split('').map(c=>c+c).join('');
  const n=parseInt(x,16);
  return [(n>>16)&255,(n>>8)&255,n&255];
}

  return WALLPAPERS.find(w=>w.id===S.wallpaper)||WALLPAPERS[0];
}

}

function dialog({title,message='',input=null,ok='OK',cancel='Cancel',danger=false,hideCancel=false}){
  return new Promise(resolve=>{
    const back=h(`<div class="modal-back"><div class="modal"><div class="modal-title">${esc(title)}</div>${message?`<div class="modal-msg">${esc(message)}</div>`:''}${input!==null?`<input class="field modal-input" spellcheck="false" autocomplete="off" value="${esc(input)}">`:''}<div class="modal-actions">${hideCancel?'':`<button class="btn" data-r="0">${esc(cancel)}</button>`}<button class="btn ${danger?'danger':'primary'}" data-r="1">${esc(ok)}</button></div></div></div>`);
    $('#modal-root').appendChild(back);
    const inp=$('.modal-input',back);
    let finished=false;
    const done=v=>{
      if(finished)return;
      finished=true;
      back.classList.add('out');
      setTimeout(()=>back.remove(),160);
      document.removeEventListener('keydown',kd,true);
      resolve(v);
    };
    const kd=e=>{
      if(e.key==='Escape'){e.preventDefault();e.stopPropagation();done(null)}
      else if(e.key==='Enter'){e.preventDefault();e.stopPropagation();done(inp?inp.value:true)}
    };
    document.addEventListener('keydown',kd,true);
    back.addEventListener('pointerdown',e=>{if(e.target===back)done(null)});
    $$('[data-r]',back).forEach(b=>b.onclick=()=>done(b.dataset.r==='1'?(inp?inp.value:true):null));
    requestAnimationFrame(()=>{if(inp){inp.focus();const dot=inp.value.lastIndexOf('.');inp.setSelectionRange(0,dot>0?dot:inp.value.length)}});
  });
}

let menuEl=null;
function closeMenu(){if(menuEl){menuEl.remove();menuEl=null}}
function showMenu(x,y,items,opts={}){
  closeMenu();
  const el=h('<div class="menu"></div>');
  items.forEach(it=>{
    if(it.sep){el.appendChild(h('<div class="menu-sep"></div>'));return}
    const row=h(`<button class="menu-item${it.danger?' danger':''}${it.disabled?' disabled':''}">${it.icon?icon(it.icon,15):'<span class="mi-gap"></span>'}<span class="mi-l">${esc(it.label)}</span>${it.checked?icon('check',14):''}${it.shortcut?`<span class="mi-s">${esc(it.shortcut)}</span>`:''}</button>`);
    row.addEventListener('click',()=>{if(it.disabled)return;closeMenu();if(it.action)it.action()});
    el.appendChild(row);
  });
  el.style.visibility='hidden';
  $('#os').appendChild(el);
  const w=el.offsetWidth,hh=el.offsetHeight;
  let left=clamp(x,6,innerWidth-w-6);
  let top=opts.up?y-hh:y;
  if(top+hh>innerHeight-6)top=Math.max(6,y-hh);
  if(top<6)top=6;
  el.style.left=left+'px';
  el.style.top=top+'px';
  el.style.visibility='';
  menuEl=el;
}
document.addEventListener('pointerdown',e=>{if(menuEl&&!menuEl.contains(e.target))closeMenu()},true);

function toast({title,msg='',icon:ic='info',force=false}){

  const el=h(`<div class="toast"><div class="t-ic">${icon(ic,16)}</div><div class="t-b"><b>${esc(title)}</b>${msg?`<span>${esc(msg)}</span>`:''}</div></div>`);
  const box=$('#toasts');
  box.appendChild(el);
  while(box.children.length>4)box.firstChild.remove();
  const kill=()=>{el.classList.add('out');setTimeout(()=>el.remove(),260)};
  el.addEventListener('click',kill);
  setTimeout(kill,4200);
}

const SYSTEM_IDS=['root','desktop','documents','pictures','music','downloads','trash'];
function seedFS(){
  const t=Date.now(),n={};
  const add=(id,name,type,parent,content='')=>{n[id]={id,name,type,parent,content,created:t,modified:t}};
  add('root','Home','folder',null);

  add('f2','Shortcuts.txt','file','documents','Keyboard shortcuts\n\nEscape            Close menus and panels\nF2                Rename the selected item\nDelete            Move the selected item to Trash\nCtrl+C / X / V    Copy, cut and paste items in Files\nCtrl+A            Select everything in Files\nCtrl+L            Clear the terminal\nUp / Down         Terminal command history\nTab               Terminal auto complete\n');
  add('f3','Project Ideas.md','file','documents','# Project Ideas\n\n1. A tiny weather station using the Music player as a rain machine\n2. Collect wallpapers and rank them\n3. Write a terminal game\n4. Organise the Files app into something useful\n');
  add('f4','Tracklist.txt','file','music','Midnight Drive, extra Quartet\nGlass Hours, Halcyon\nStatic Bloom, Violet Static\nLow Tide, Aurelia\nNeon Rain, Cobalt Hours\n\nOpen the Music app to play them.\n');
  return n;
}
const fs={
  nodes:null,
  load(){
    const d=store.get('fs',null);
    this.nodes=d&&d.root&&d.trash?d:seedFS();
  },
  save(silent){
    store.set('fs',this.nodes);
    bus.emit(silent?'fs:content':'fs');
  },
  get(id){return this.nodes[id]},
  kids(id){
    return Object.values(this.nodes).filter(n=>n.parent===id).sort((a,b)=>{
      if(a.type!==b.type)return a.type==='folder'?-1:1;
      return a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:'base'});
    });
  },
  unique(parent,name,ignore){
    const taken=new Set(this.kids(parent).filter(k=>k.id!==ignore).map(k=>k.name.toLowerCase()));
    if(!taken.has(name.toLowerCase()))return name;
    const dot=name.lastIndexOf('.');
    const base=dot>0?name.slice(0,dot):name,ext=dot>0?name.slice(dot):'';
    let i=2;
    while(taken.has((base+' ('+i+')'+ext).toLowerCase()))i++;
    return base+' ('+i+')'+ext;
  },
  create(parent,name,type,content=''){
    const t=Date.now(),id=uid()+uid();
    const node={id,name:this.unique(parent,name),type,parent,content,created:t,modified:t};
    this.nodes[id]=node;
    this.save();
    return node;
  },
  validName(name){
    name=(name||'').trim();
    if(!name)return 'Name cannot be empty';
    if(/[\/\\]/.test(name))return 'Names cannot contain slashes';
    if(name.length>80)return 'Name is too long';
    return null;
  },
  rename(id,name){
    const n=this.get(id);
    name=(name||'').trim();
    const bad=this.validName(name);
    if(bad)return bad;
    if(SYSTEM_IDS.includes(id))return 'System folders cannot be renamed';
    if(this.kids(n.parent).some(k=>k.id!==id&&k.name.toLowerCase()===name.toLowerCase()))return 'An item with that name already exists';
    n.name=name;
    n.modified=Date.now();
    this.save();
    return null;
  },
  isInside(id,anc){
    let n=this.get(id);
    while(n){if(n.id===anc)return true;n=this.get(n.parent)}
    return false;
  },
  isTrashed(id){return this.isInside(id,'trash')},
  move(id,parent){
    const n=this.get(id),t=this.get(parent);
    if(!n||!t||t.type!=='folder'||SYSTEM_IDS.includes(id))return false;
    if(id===parent||this.isInside(parent,id)||n.parent===parent)return false;
    n.name=this.unique(parent,n.name,id);
    n.parent=parent;
    delete n.trashedFrom;
    this.save();
    return true;
  },
  copy(id,parent,silent){
    const n=this.get(id);
    if(!n)return null;
    const c=this.create(parent,n.name,n.type,n.content);
    if(n.type==='folder')this.kids(id).forEach(k=>this.copy(k.id,c.id,true));
    return c;
  },
  trash(id){
    const n=this.get(id);
    if(!n||SYSTEM_IDS.includes(id)||this.isTrashed(id))return false;
    n.trashedFrom=n.parent;
    n.name=this.unique('trash',n.name,id);
    n.parent='trash';
    this.save();
    return true;
  },
  restore(id){
    const n=this.get(id);
    if(!n||n.parent!=='trash')return false;
    const t=this.get(n.trashedFrom);
    const dest=t&&!this.isTrashed(t.id)?t.id:'root';
    n.name=this.unique(dest,n.name,id);
    n.parent=dest;
    delete n.trashedFrom;
    this.save();
    return true;
  },
  purge(id){
    const n=this.get(id);
    if(!n||SYSTEM_IDS.includes(id))return;
    this.kids(id).forEach(k=>this.purge(k.id));
    delete this.nodes[id];
    this.save();
  },
  emptyTrash(){this.kids('trash').forEach(k=>this.purge(k.id))},
  path(id){
    const parts=[];
    let n=this.get(id);
    while(n){
      if(n.id==='root'){parts.unshift('~');break}
      parts.unshift(n.name);
      n=this.get(n.parent);
    }
    return parts.join('/');
  },
  resolve(p,cwd='root'){
    p=(p||'').trim();
    if(p===''||p==='.')return this.get(cwd);
    let cur,parts;
    if(p==='~'||p.startsWith('~/')){cur='root';parts=p.slice(1).split('/')}
    else if(p.startsWith('/')){cur='root';parts=p.split('/')}
    else{cur=cwd;parts=p.split('/')}
    let node=this.get(cur);
    for(const part of parts){
      if(!part||part==='.')continue;
      if(part==='..'){node=this.get(node.parent)||node;continue}
      if(node.type!=='folder')return null;
      const k=this.kids(node.id);
      node=k.find(x=>x.name===part)||k.find(x=>x.name.toLowerCase()===part.toLowerCase());
      if(!node)return null;
    }
    return node;
  },
  ext(name){const d=name.lastIndexOf('.');return d>0?name.slice(d+1).toLowerCase():''},
  size(n){return n.type==='folder'?this.kids(n.id).length:new Blob([n.content||'']).size},
  kind(n){
    if(n.type==='folder')return 'Folder';
    const e=this.ext(n.name);
    return e==='txt'?'Text document':e==='md'?'Markdown document':e?e.toUpperCase()+' file':'File';
  }
};
fs.load();

let clip={ids:[],mode:null};
function pasteInto(parent){
  if(!clip.ids.length)return 0;
  let n=0;
  clip.ids.forEach(id=>{
    if(!fs.get(id))return;
    if(clip.mode==='cut'){if(fs.move(id,parent))n++}
    else{fs.copy(id,parent);n++}
  });
  if(clip.mode==='cut')clip={ids:[],mode:null};
  return n;
}
function moveItems(ids,target){
  let n=0;
  ids.forEach(id=>{
    if(target==='trash'){if(fs.trash(id))n++}
    else if(fs.move(id,target))n++;
  });
  return n;
}
function openNode(node){
  if(!node)return;
  if(fs.isTrashed(node.id)){toast({title:'Item is in the Trash',msg:'Restore it before opening.',icon:'trash'});return}
  if(node.type==='folder')wm.open('files',{folder:node.id});
  else wm.open('editor',{id:node.id});
}

}

<script>
const APP_IMPL={};
const wm={list:[],z:100,active:null,cascade:0,restoreSet:null};

wm.open=function(app,opts={}){
  const impl=APP_IMPL[app];
  if(!impl)return null;
  if(impl.single){
    const ex=wm.list.find(w=>w.app===app);
    if(ex){wm.focus(ex);if(impl.reopen)impl.reopen(ex,opts);return ex}
  }
  if(impl.find){
    const ex=wm.list.find(w=>w.app===app&&impl.find(w,opts));
    if(ex){wm.focus(ex);return ex}
  }
  return wm.create(app,impl,opts);
};

wm.create=function(app,impl,opts){
  const layer=$('#windows'),lw=layer.clientWidth,lh=layer.clientHeight;
  const mobile=lw<720;
  const w=Math.min(impl.w,lw-16),hh=Math.min(impl.h,lh-16);
  const n=wm.cascade++%7;
  const x=clamp(Math.round((lw-w)/2+(n-3)*26),0,Math.max(0,lw-w));
  const y=clamp(Math.round((lh-hh)/2+(n-3)*22-8),0,Math.max(0,lh-hh));
  const meta=APPS[app];
  const el=h(`<div class="win"><div class="win-title"><span class="win-ic">${appIcon(app,18)}</span><span class="win-name"></span><div class="win-ctrls"><button class="wc" data-a="min" title="Minimize">${WC.min}</button><button class="wc" data-a="max" title="Maximize">${WC.max}</button><button class="wc close" data-a="close" title="Close">${WC.close}</button></div></div><div class="win-body"></div>${['n','s','e','w','ne','nw','se','sw'].map(d=>`<i class="rz rz-${d}" data-d="${d}"></i>`).join('')}</div>`);
  const win={
    id:uid(),app,el,body:$('.win-body',el),rect:{x,y,w,h:hh},minW:impl.minW||320,minH:impl.minH||220,
    state:'normal',min:false,closing:false,cleanups:[],title:meta.name,
    setTitle(t){this.title=t;$('.win-name',el).textContent=t;bus.emit('wm')},
    listen(ev,fn){this.cleanups.push(bus.on(ev,fn))},
    onClose(fn){this.cleanups.push(fn)},
    close(){wm.close(this)}
  };
  $('.win-name',el).textContent=meta.name;
  wm.list.push(win);
  layer.appendChild(el);
  wm.layout(win,false);
  wm.wire(win);
  impl.create(win,opts);
  wm.focus(win);
  if(mobile)wm.setState(win,'max',false);
  bus.emit('wm:open',app);
  bus.emit('wm');
  return win;
};

wm.layout=function(win,animate){
  const L=$('#windows'),lw=L.clientWidth,lh=L.clientHeight;
  let r=win.rect;
  if(win.state==='left')r={x:0,y:0,w:Math.floor(lw/2),h:lh};
  else if(win.state==='right')r={x:Math.floor(lw/2),y:0,w:lw-Math.floor(lw/2),h:lh};
  win.el.classList.toggle('max',win.state==='max');
  win.el.classList.toggle('snapped',win.state==='left'||win.state==='right');
  if(animate&&animOn()){
    win.el.classList.add('animating');
    clearTimeout(win._at);
    win._at=setTimeout(()=>win.el.classList.remove('animating'),300);
  }
  win.el.style.left=r.x+'px';
  win.el.style.top=r.y+'px';
  win.el.style.width=r.w+'px';
  win.el.style.height=r.h+'px';
  const mb=$('[data-a=max]',win.el);
  mb.innerHTML=win.state==='max'?WC.rest:WC.max;
  mb.title=win.state==='max'?'Restore':'Maximize';
};

wm.setState=function(win,state,animate=true){
  win.state=state;
  wm.layout(win,animate);
  bus.emit('wm:resize',win);
};

wm.currentRect=function(win){
  const L=$('#windows'),lw=L.clientWidth,lh=L.clientHeight;
  if(win.state==='max')return {x:0,y:0,w:lw,h:lh};
  if(win.state==='left')return {x:0,y:0,w:Math.floor(lw/2),h:lh};
  if(win.state==='right')return {x:Math.floor(lw/2),y:0,w:lw-Math.floor(lw/2),h:lh};
  return win.rect;
};

wm.wire=function(win){
  const el=win.el,title=$('.win-title',el);
  el.addEventListener('pointerdown',()=>{if(wm.active!==win)wm.focus(win)},true);
  el.addEventListener('click',e=>{
    const b=e.target.closest('[data-a]');
    if(!b)return;
    const a=b.dataset.a;
    if(a==='close')wm.close(win);
    else if(a==='min')wm.minimize(win);
    else if(a==='max')wm.toggleMax(win);
  });
  title.addEventListener('dblclick',e=>{if(!e.target.closest('.wc'))wm.toggleMax(win)});
  title.addEventListener('pointerdown',e=>{
    if(e.button!==0||e.target.closest('.wc'))return;
    const lay=$('#windows').getBoundingClientRect();
    const sx=e.clientX,sy=e.clientY;
    let started=false,ox=0,oy=0,snap=null;
    const prev=$('#snap-preview');
    const move=ev=>{
      const dx=ev.clientX-sx,dy=ev.clientY-sy;
      if(!started){
        if(Math.hypot(dx,dy)<4)return;
        started=true;
        if(win.state!=='normal'){
          const cur=wm.currentRect(win);
          const rel=clamp((sx-lay.left-cur.x)/cur.w,0,1);
          win.rect.x=Math.round(sx-lay.left-rel*win.rect.w);
          win.rect.y=clamp(Math.round(sy-lay.top-18),0,lay.height-60);
          win.state='normal';
          wm.layout(win,false);
          bus.emit('wm:resize',win);
        }
        ox=win.rect.x;oy=win.rect.y;
        title.setPointerCapture(e.pointerId);
      }
      win.rect.x=clamp(ox+dx,-win.rect.w+140,lay.width-100);
      win.rect.y=clamp(oy+dy,0,lay.height-44);
      wm.layout(win,false);
      let t=null;
      if(ev.clientY<=3)t='max';
      else if(ev.clientX<=3)t='left';
      else if(ev.clientX>=innerWidth-4)t='right';
      if(t!==snap){
        snap=t;
        if(!t){prev.style.opacity=0}
        else{
          const r=t==='max'?{x:6,y:6,w:lay.width-12,h:lay.height-12}:t==='left'?{x:6,y:6,w:lay.width/2-9,h:lay.height-12}:{x:lay.width/2+3,y:6,w:lay.width/2-9,h:lay.height-12};
          prev.style.left=r.x+'px';prev.style.top=r.y+'px';prev.style.width=r.w+'px';prev.style.height=r.h+'px';
          prev.style.opacity=1;
        }
      }
    };
    const up=()=>{
      title.removeEventListener('pointermove',move);
      title.removeEventListener('pointerup',up);
      title.removeEventListener('pointercancel',up);
      prev.style.opacity=0;
      if(started&&snap)wm.setState(win,snap,true);
    };
    title.addEventListener('pointermove',move);
    title.addEventListener('pointerup',up);
    title.addEventListener('pointercancel',up);
  });
  $$('.rz',el).forEach(hd=>hd.addEventListener('pointerdown',e=>{
    if(e.button!==0||win.state==='max')return;
    e.preventDefault();e.stopPropagation();
    if(win.state!=='normal'){
      win.rect=Object.assign({},wm.currentRect(win));
      win.state='normal';
      wm.layout(win,false);
    }
    const d=hd.dataset.d,sx=e.clientX,sy=e.clientY,r0=Object.assign({},win.rect);
    hd.setPointerCapture(e.pointerId);
    const move=ev=>{
      const dx=ev.clientX-sx,dy=ev.clientY-sy;
      let nx=r0.x,ny=r0.y,nw=r0.w,nh=r0.h;
      if(d.includes('e'))nw=Math.max(win.minW,r0.w+dx);
      if(d.includes('s'))nh=Math.max(win.minH,r0.h+dy);
      if(d.includes('w')){nw=Math.max(win.minW,r0.w-dx);nx=r0.x+r0.w-nw}
      if(d.includes('n')){nh=Math.max(win.minH,r0.h-dy);ny=r0.y+r0.h-nh;if(ny<0){nh+=ny;ny=0}}
      win.rect={x:nx,y:ny,w:nw,h:nh};
      wm.layout(win,false);
      bus.emit('wm:resize',win);
    };
    const up=()=>{hd.removeEventListener('pointermove',move);hd.removeEventListener('pointerup',up);hd.removeEventListener('pointercancel',up)};
    hd.addEventListener('pointermove',move);
    hd.addEventListener('pointerup',up);
    hd.addEventListener('pointercancel',up);
  }));
};

wm.toggleMax=function(win){wm.setState(win,win.state==='max'?'normal':'max',true)};

wm.topWindow=function(){
  const vis=wm.list.filter(w=>!w.min&&!w.closing);
  return vis.sort((a,b)=>(+b.el.style.zIndex||0)-(+a.el.style.zIndex||0))[0]||null;
};

wm.focus=function(win){
  if(win.min){wm.restore(win);return}
  win.el.style.zIndex=++wm.z;
  wm.list.forEach(w=>w.el.classList.toggle('focused',w===win));
  wm.active=win;
  if(wm.z>8000){
    const s=wm.list.slice().sort((a,b)=>a.el.style.zIndex-b.el.style.zIndex);
    s.forEach((w,i)=>w.el.style.zIndex=100+i);
    wm.z=100+s.length;
  }
  bus.emit('wm');
};

wm.blur=function(){
  wm.active=null;
  wm.list.forEach(w=>w.el.classList.remove('focused'));
  bus.emit('wm');
};

wm.minimize=function(win){
  if(win.min)return;
  const btn=$(`.tb-btn[data-app="${win.app}"]`);
  const wr=win.el.getBoundingClientRect();
  let tx=0,ty=window.innerHeight;
  if(btn){
    const b=btn.getBoundingClientRect();
    tx=b.left+b.width/2-(wr.left+wr.width/2);
    ty=b.top+b.height/2-(wr.top+wr.height/2);
  }
  win.el.style.setProperty('--tx',tx+'px');
  win.el.style.setProperty('--ty',ty+'px');
  win.min=true;
  win.el.classList.remove('focused');
  win.el.classList.add('minimizing');
  setTimeout(()=>{
    if(win.min)win.el.classList.add('min');
    win.el.classList.remove('minimizing');
  },animOn()?230:0);
  if(wm.active===win){
    wm.active=null;
    const next=wm.topWindow();
    if(next)wm.focus(next);
  }
  bus.emit('wm');
};

wm.restore=function(win){
  if(win.min){
    win.min=false;
    win.el.classList.remove('min');
    win.el.classList.add('minimizing');
    void win.el.offsetWidth;
    win.el.classList.remove('minimizing');
  }
  wm.focus(win);
};

wm.close=function(win){
  if(win.closing)return;
  win.closing=true;
  win.cleanups.forEach(f=>{try{f()}catch(e){}});
  wm.list=wm.list.filter(w=>w!==win);
  win.el.classList.add('closing');
  setTimeout(()=>win.el.remove(),animOn()?190:0);
  if(wm.active===win){
    wm.active=null;
    const next=wm.topWindow();
    if(next)wm.focus(next);
  }
  bus.emit('wm');
};

wm.closeAll=function(){wm.list.slice().forEach(w=>wm.close(w))};

wm.showDesktop=function(){
  const vis=wm.list.filter(w=>!w.min);
  if(vis.length){
    wm.restoreSet=vis;
    vis.forEach(w=>wm.minimize(w));
  }else if(wm.restoreSet){
    wm.restoreSet.filter(w=>wm.list.includes(w)).forEach(w=>wm.restore(w));
    wm.restoreSet=null;
  }
};

window.addEventListener('resize',()=>{
  const L=$('#windows'),lw=L.clientWidth,lh=L.clientHeight;
  wm.list.forEach(w=>{
    w.rect.w=Math.min(w.rect.w,lw);
    w.rect.h=Math.min(w.rect.h,lh);
    w.rect.x=clamp(w.rect.x,Math.min(0,lw-w.rect.w),Math.max(0,lw-w.rect.w));
    w.rect.y=clamp(w.rect.y,0,Math.max(0,lh-w.rect.h));
    wm.layout(w,false);
  });
  clearTimeout(window._rt);
  window._rt=setTimeout(renderIcons,120);
});

function renderTaskbar(){
  const box=$('#tb-apps');
  const extra=[...new Set(wm.list.map(w=>w.app))].filter(a=>!PINNED.includes(a));
  const apps=PINNED.concat(extra);
  box.innerHTML=`<button class="tb-btn start-btn${$('#start').classList.contains('open')?' open':''}" data-trigger="start" title="Start">${logo(26)}</button>`+apps.map(a=>{
    const ws=wm.list.filter(w=>w.app===a);
    const act=wm.active&&wm.active.app===a&&!wm.active.min;
    return `<button class="tb-btn${ws.length?' running':''}${act?' active':''}" data-app="${a}" title="${esc(APPS[a].name)}${ws.length>1?' ('+ws.length+' windows)':''}">${appIcon(a,30)}</button>`;
  }).join('');
}
function taskbarClick(app){
  const ws=wm.list.filter(w=>w.app===app);
  if(!ws.length){wm.open(app);return}
  if(ws.length===1){
    const w=ws[0];
    if(w.min)wm.restore(w);
    else if(wm.active===w)wm.minimize(w);
    else wm.focus(w);
    return;
  }
  if(wm.active&&wm.active.app===app&&!wm.active.min){
    const b=$(`.tb-btn[data-app="${app}"]`).getBoundingClientRect();
    showMenu(b.left,b.top-8,ws.map(w=>({label:w.title,icon:APPS[app].icon,action:()=>wm.restore(w)})),{up:true});
  }else{
    const top=ws.slice().sort((a,b)=>(+b.el.style.zIndex||0)-(+a.el.style.zIndex||0))[0];
    wm.restore(top);
  }
}
$('#tb-apps').addEventListener('click',e=>{
  const b=e.target.closest('.tb-btn[data-app]');
  if(b)taskbarClick(b.dataset.app);
});
$('#tb-apps').addEventListener('contextmenu',e=>{
  const b=e.target.closest('.tb-btn[data-app]');
  if(!b)return;
  const app=b.dataset.app,ws=wm.list.filter(w=>w.app===app),r=b.getBoundingClientRect();
  const items=[{label:ws.length?'New window':'Open',icon:'plus',action:()=>wm.open(app),disabled:!!(APP_IMPL[app].single&&ws.length)}];
  if(ws.length)items.push({sep:true},{label:ws.length>1?'Close all windows':'Close window',icon:'x',danger:true,action:()=>ws.forEach(w=>wm.close(w))});
  showMenu(r.left,r.top-8,items,{up:true});
});
bus.on('wm',renderTaskbar);
bus.on('wm:open',app=>{
  requestAnimationFrame(()=>{
    const b=$(`.tb-btn[data-app="${app}"]`);
    if(b&&animOn()){b.classList.add('bounce');setTimeout(()=>b.classList.remove('bounce'),520)}
  });
});
$('#show-desktop').addEventListener('click',()=>wm.showDesktop());
$('#np').addEventListener('click',()=>wm.open('music'));

const ICON_W=92,ICON_H=100,ICON_PAD=14;
let iconPos=store.get('icons',{});
let iconSel=null;
function desktopItems(){
  const apps=['files','browser','notes','terminal','music','calculator','settings','trash'].map(a=>({id:'app:'+a,kind:'app',app:a,name:APPS[a].name}));
  const files=fs.kids('desktop').map(n=>({id:'fs:'+n.id,kind:'fs',node:n,name:n.name}));
  return apps.concat(files);
}
function slotPos(i,lh){
  const rows=Math.max(1,Math.floor((lh-ICON_PAD)/ICON_H));
  return {x:ICON_PAD+Math.floor(i/rows)*ICON_W,y:ICON_PAD+(i%rows)*ICON_H};
}
function renderIcons(){
  const box=$('#icons');
  const lw=box.clientWidth,lh=box.clientHeight;
  const items=desktopItems();
  const placed=new Map();
  items.forEach(it=>{
    const p=iconPos[it.id];
    if(p)placed.set(it.id,{x:clamp(p.x,0,Math.max(0,lw-ICON_W)),y:clamp(p.y,0,Math.max(0,lh-ICON_H))});
  });
  const occupied=(x,y)=>Array.from(placed.values()).some(q=>Math.abs(q.x-x)<ICON_W-8&&Math.abs(q.y-y)<ICON_H-8);
  let slot=0;
  items.forEach(it=>{
    if(placed.has(it.id))return;
    let p;
    do{p=slotPos(slot++,lh)}while(occupied(p.x,p.y)&&slot<600);
    placed.set(it.id,p);
  });
  if(iconSel&&!items.some(i=>i.id===iconSel))iconSel=null;
  box.innerHTML=items.map(it=>{
    const p=placed.get(it.id);
    let ic;
    if(it.kind==='app'){
      if(it.app==='trash')ic=appIcon('trash',Math.round(parseInt(getComputedStyle(document.documentElement).getPropertyValue('--isz'))*.9||44));
      else ic=appIcon(it.app,Math.round(parseInt(getComputedStyle(document.documentElement).getPropertyValue('--isz'))*.9||44));
    }else ic=it.node.type==='folder'?BIG_FOLDER:BIG_FILE;
    return `<div class="dicon${iconSel===it.id?' sel':''}" data-id="${esc(it.id)}" style="left:${p.x}px;top:${p.y}px"><div class="dicon-ic">${ic}</div><div class="dicon-name">${esc(it.name)}</div></div>`;
  }).join('');
}
function openDesktopItem(id){
  if(id.startsWith('app:')){
    const a=id.slice(4);
    if(a==='trash')wm.open('files',{folder:'trash'});
    else wm.open(a);
  }else openNode(fs.get(id.slice(3)));
}
function nearestFree(x,y,selfId){
  const box=$('#icons'),lw=box.clientWidth,lh=box.clientHeight;
  const others=Array.from($$('.dicon',box)).filter(d=>d.dataset.id!==selfId).map(d=>({x:parseInt(d.style.left),y:parseInt(d.style.top)}));
  const free=(cx,cy)=>!others.some(o=>Math.abs(o.x-cx)<ICON_W-8&&Math.abs(o.y-cy)<ICON_H-8);
  const cols=Math.max(1,Math.floor((lw-ICON_PAD)/ICON_W)),rows=Math.max(1,Math.floor((lh-ICON_PAD)/ICON_H));
  let best=null,bd=1e9;
  for(let c=0;c<cols;c++)for(let r=0;r<rows;r++){
    const cx=ICON_PAD+c*ICON_W,cy=ICON_PAD+r*ICON_H;
    if(!free(cx,cy))continue;
    const d=(cx-x)**2+(cy-y)**2;
    if(d<bd){bd=d;best={x:cx,y:cy}}
  }
  return best||{x,y};
}
function snapIcon(x,y,selfId){
  const box=$('#icons'),lw=box.clientWidth,lh=box.clientHeight;
  x=clamp(x,0,Math.max(0,lw-ICON_W));
  y=clamp(y,0,Math.max(0,lh-ICON_H));
  if(!S.snap)return {x,y};
  const cx=ICON_PAD+Math.round((x-ICON_PAD)/ICON_W)*ICON_W;
  const cy=ICON_PAD+Math.round((y-ICON_PAD)/ICON_H)*ICON_H;
  return nearestFree(clamp(cx,0,Math.max(0,lw-ICON_W)),clamp(cy,0,Math.max(0,lh-ICON_H)),selfId);
}
function setIconSel(id){
  iconSel=id;
  $$('.dicon').forEach(d=>d.classList.toggle('sel',d.dataset.id===id));
}
(function(){
  const box=$('#icons');
  box.addEventListener('pointerdown',e=>{
    const el=e.target.closest('.dicon');
    if(!el){setIconSel(null);return}
    if(e.button!==0){setIconSel(el.dataset.id);return}
    const id=el.dataset.id;
    setIconSel(id);
    wm.blur();
    const sx=e.clientX,sy=e.clientY,ox=parseInt(el.style.left),oy=parseInt(el.style.top);
    let moved=false,targetEl=null;
    const lay=box.getBoundingClientRect();
    const move=ev=>{
      const dx=ev.clientX-sx,dy=ev.clientY-sy;
      if(!moved){
        if(Math.hypot(dx,dy)<5)return;
        moved=true;
        el.classList.add('moving');
        el.setPointerCapture(e.pointerId);
      }
      el.style.left=clamp(ox+dx,0,lay.width-ICON_W)+'px';
      el.style.top=clamp(oy+dy,0,lay.height-ICON_H)+'px';
      let t=null;
      if(id.startsWith('fs:')){
        const under=Array.from($$('.dicon')).find(d=>d!==el&&d.dataset.id==='app:trash'&&ev.clientX>=d.getBoundingClientRect().left&&ev.clientX<=d.getBoundingClientRect().right&&ev.clientY>=d.getBoundingClientRect().top&&ev.clientY<=d.getBoundingClientRect().bottom);
        t=under||null;
      }
      if(t!==targetEl){if(targetEl)targetEl.classList.remove('target');targetEl=t;if(t)t.classList.add('target')}
    };
    const up=ev=>{
      el.removeEventListener('pointermove',move);
      el.removeEventListener('pointerup',up);
      el.removeEventListener('pointercancel',up);
      if(targetEl)targetEl.classList.remove('target');
      if(!moved){
        if(ev.pointerType==='touch'||ev.pointerType==='pen')openDesktopItem(id);
        return;
      }
      el.classList.remove('moving');
      if(targetEl&&id.startsWith('fs:')){
        const n=fs.get(id.slice(3));
        if(n&&fs.trash(n.id))toast({title:'Moved to Trash',msg:n.name,icon:'trash'});
        return;
      }
      const p=snapIcon(parseInt(el.style.left),parseInt(el.style.top),id);
      el.style.left=p.x+'px';
      el.style.top=p.y+'px';
      iconPos[id]=p;
      store.set('icons',iconPos);
    };
    el.addEventListener('pointermove',move);
    el.addEventListener('pointerup',up);
    el.addEventListener('pointercancel',up);
  });
  box.addEventListener('dblclick',e=>{
    const el=e.target.closest('.dicon');
    if(el)openDesktopItem(el.dataset.id);
  });
})();
function renameDesktopNode(n){
  askName('Rename',n.name,'Rename').then(v=>{
    if(v===null)return;
    const err=fs.rename(n.id,v);
    if(err)toast({title:'Could not rename',msg:err,icon:'info',force:true});
  });
}
function trashNode(n){
  if(fs.trash(n.id))toast({title:'Moved to Trash',msg:n.name,icon:'trash'});
}
async function createOnDesktop(type,at){
  const base=type==='folder'?'New Folder':'Untitled.txt';
  const name=await askName(type==='folder'?'New folder':'New text document',fs.unique('desktop',base));
  if(name===null)return;
  const bad=fs.validName(name);
  if(bad){toast({title:'Could not create',msg:bad,icon:'info',force:true});return}
  const node=fs.create('desktop',name.trim(),type,'');
  if(at){
    const box=$('#icons').getBoundingClientRect();
    renderIcons();
    const p=snapIcon(at.x-box.left-ICON_W/2,at.y-box.top-30,'fs:'+node.id);
    iconPos['fs:'+node.id]=p;
    store.set('icons',iconPos);
    renderIcons();
  }
}
bus.on('fs',renderIcons);
bus.on('settings',p=>{if(p&&('iconSize' in p||'showIcons' in p))renderIcons()});

function toggleTheme(){setS({theme:resolvedTheme()==='dark'?'light':'dark'})}
function desktopMenu(x,y){
  const items=[
    {label:'New folder',icon:'folderPlus',action:()=>createOnDesktop('folder',{x,y})},
    {label:'New text document',icon:'filePlus',action:()=>createOnDesktop('file',{x,y})},
    {label:'Paste',icon:'clipboard',disabled:!clip.ids.length,action:()=>{const n=pasteInto('desktop');if(n)toast({title:'Pasted '+n+(n>1?' items':' item'),icon:'clipboard'})}},
    {sep:true},
    {label:'Arrange icons',icon:'grid',action:()=>{iconPos={};store.set('icons',iconPos);renderIcons()}},
    {label:'Small icons',checked:S.iconSize==='sm',action:()=>setS({iconSize:'sm'})},
    {label:'Medium icons',checked:S.iconSize==='md',action:()=>setS({iconSize:'md'})},
    {label:'Large icons',checked:S.iconSize==='lg',action:()=>setS({iconSize:'lg'})},
    {label:'Refresh',icon:'refresh',action:()=>{const b=$('#icons');b.classList.remove('fadein');void b.offsetWidth;b.classList.add('fadein');renderIcons()}},
    {sep:true},
    {label:'Open Terminal here',icon:'terminal',action:()=>wm.open('terminal',{cwd:'desktop'})},
    {label:'Change wallpaper',icon:'image',action:()=>wm.open('settings',{page:'personalization'})},
    {label:resolvedTheme()==='dark'?'Switch to light mode':'Switch to dark mode',icon:resolvedTheme()==='dark'?'sun':'moon',action:toggleTheme},
    {label:'Display settings',icon:'gear',action:()=>wm.open('settings',{page:'appearance'})}
  ];
  showMenu(x,y,items);
}
function iconMenu(id,x,y){
  setIconSel(id);
  const items=[{label:'Open',icon:'arrowR',action:()=>openDesktopItem(id)}];
  if(id==='app:trash'){
    items.push({sep:true},{label:'Empty Trash',icon:'trash',danger:true,disabled:!fs.kids('trash').length,action:async()=>{
      if(await confirmBox('Empty Trash','All items in the Trash will be permanently deleted.','Empty Trash')){fs.emptyTrash();toast({title:'Trash emptied',icon:'trash'})}
    }});
  }else if(id.startsWith('fs:')){
    const n=fs.get(id.slice(3));
    items.push({sep:true},
      {label:'Rename',icon:'pencil',shortcut:'F2',action:()=>renameDesktopNode(n)},
      {label:'Cut',icon:'scissors',action:()=>{clip={ids:[n.id],mode:'cut'}}},
      {label:'Copy',icon:'copy',action:()=>{clip={ids:[n.id],mode:'copy'}}},
      {sep:true},
      {label:'Move to Trash',icon:'trash',danger:true,shortcut:'Del',action:()=>trashNode(n)});
  }
  showMenu(x,y,items);
}
$('#desktop').addEventListener('contextmenu',e=>{
  if(e.target.closest('.win'))return;
  const ic=e.target.closest('.dicon');
  if(ic)iconMenu(ic.dataset.id,e.clientX,e.clientY);
  else desktopMenu(e.clientX,e.clientY);
});
$('#desktop').addEventListener('pointerdown',e=>{
  if(e.target.closest('.win')||e.target.closest('.dicon'))return;
  wm.blur();
});

const panels={start:'#start',calendar:'#calendar',quick:'#quick'};
const onPanelOpen={};
function closePanels(){
  Object.values(panels).forEach(s=>$(s).classList.remove('open'));
  $$('[data-trigger]').forEach(b=>b.classList.remove('open'));
  $('#start-in')&&$('#start-in').blur();
}
function togglePanel(name){
  const el=$(panels[name]);
  const was=el.classList.contains('open');
  closePanels();
  closeMenu();
  if(!was){
    el.classList.add('open');
    $$(`[data-trigger="${name}"]`).forEach(b=>b.classList.add('open'));
    if(onPanelOpen[name])onPanelOpen[name]();
  }
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-trigger]');
  if(t)togglePanel(t.dataset.trigger);
});
document.addEventListener('pointerdown',e=>{
  if(!e.target.closest('.panel,[data-trigger],.menu,.modal-back'))closePanels();
},true);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closePanels();closeMenu()}
});

function recentItems(){
  const files=Object.values(fs.nodes).filter(n=>n.type==='file'&&!fs.isTrashed(n.id)).map(n=>({kind:'file',id:n.id,title:n.name,sub:fs.path(n.parent),when:n.modified}));
  const notes=(store.get('notes',[])||[]).map(n=>({kind:'note',id:n.id,title:n.title||'Untitled',sub:'Note',when:n.updated}));
  return files.concat(notes).sort((a,b)=>b.when-a.when).slice(0,6);
}
function recRow(r,first){
  const ic=r.kind==='note'?icon('note',18):r.kind==='folder'?BIG_FOLDER:BIG_FILE;
  return `<button class="rec${first?' first':''}" data-kind="${r.kind}" data-id="${esc(r.id)}"><span class="rec-ic">${ic}</span><span class="rec-t"><b>${esc(r.title)}</b><span>${esc(r.sub)}</span></span></button>`;
}
function renderStartHome(){
  const rec=recentItems();
  $('#start-body').innerHTML=`<div class="sec-title">Pinned</div><div class="start-grid">${PINNED.map(a=>`<button class="start-app" data-app="${a}">${appIcon(a,44)}<span>${APPS[a].name}</span></button>`).join('')}</div><div class="sec-title">Recommended</div><div class="rec-grid">${rec.length?rec.map(r=>recRow(r,false)).join(''):'<div class="empty-note">Files and notes you create will show up here.</div>'}</div>`;
}
function renderStartSearch(q){
  const ql=q.toLowerCase();
  const res=[];
  Object.keys(APPS).filter(a=>a!=='trash'&&a!=='editor'&&APPS[a].name.toLowerCase().includes(ql)).forEach(a=>res.push(`<button class="rec" data-app="${a}"><span class="rec-ic" style="background:none">${appIcon(a,32)}</span><span class="rec-t"><b>${esc(APPS[a].name)}</b><span>Application</span></span></button>`));
  Object.values(fs.nodes).filter(n=>!SYSTEM_IDS.includes(n.id)&&!fs.isTrashed(n.id)&&n.name.toLowerCase().includes(ql)).slice(0,6).forEach(n=>res.push(recRow({kind:n.type==='folder'?'folder':'file',id:n.id,title:n.name,sub:fs.path(n.parent)},false)));
  (store.get('notes',[])||[]).filter(n=>(n.title+' '+n.body).toLowerCase().includes(ql)).slice(0,4).forEach(n=>res.push(recRow({kind:'note',id:n.id,title:n.title||'Untitled',sub:'Note'},false)));
  const body=$('#start-body');
  body.innerHTML=res.length?`<div class="sec-title">Results</div><div class="res-list">${res.join('')}</div>`:`<div class="empty-note" style="padding:24px 26px">No results for "${esc(q)}"</div>`;
  const first=$('.rec',body);
  if(first)first.classList.add('first');
}
function buildStart(){
  $('#start').innerHTML=`<div class="start-search">${icon('search',16)}<input id="start-in" placeholder="Search apps, files and notes" spellcheck="false" autocomplete="off"></div><div id="start-body"></div><div class="start-foot"><div class="user-chip"><span class="avatar" id="start-avatar"></span><button id="start-name" title="Account settings"></button></div><div class="pw"><button class="ibtn" data-pw="lock" title="Lock">${icon('lock',17)}</button><button class="ibtn" data-pw="restart" title="Restart">${icon('refresh',17)}</button><button class="ibtn" data-pw="off" title="Shut down">${icon('power',17)}</button></div></div>`;
  const inp=$('#start-in');
  inp.addEventListener('input',()=>{const q=inp.value.trim();q?renderStartSearch(q):renderStartHome()});
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){const f=$('#start-body .rec.first')||$('#start-body .rec');if(f)f.click()}
  });
  $('#start').addEventListener('click',e=>{
    const app=e.target.closest('[data-app]');
    if(app){closePanels();wm.open(app.dataset.app);return}
    const rec=e.target.closest('.rec[data-kind]');
    if(rec){
      closePanels();
      const k=rec.dataset.kind,id=rec.dataset.id;
      if(k==='note')wm.open('notes',{note:id});
      else openNode(fs.get(id));
      return;
    }
    const pw=e.target.closest('[data-pw]');
    if(pw){closePanels();sysAction(pw.dataset.pw);return}
    if(e.target.closest('#start-name')){closePanels();wm.open('settings',{page:'system'})}
  });
  syncUser();
}
function syncUser(){
  const n=S.username||'user';
  $('#start-avatar').textContent=n[0];
  $('#start-name').textContent=n;
  $('#lock-avatar').textContent=n[0];
  $('#lock-name').textContent=n;
}
onPanelOpen.start=()=>{const i=$('#start-in');i.value='';renderStartHome();setTimeout(()=>i.focus(),60)};

function buildQuick(){
  $('#quick').innerHTML=`<div class="q-tiles" id="q-tiles"></div><div class="q-sliders"><div class="q-row"><button class="ibtn" id="q-mute" title="Mute"></button><input type="range" class="range" id="q-vol" min="0" max="100"><span class="q-val" id="q-volv"></span></div><div class="q-row"><span class="q-ic">${icon('sun',17)}</span><input type="range" class="range" id="q-bri" min="20" max="100"><span class="q-val" id="q-briv"></span></div></div><div class="q-foot"><div class="q-batt" id="q-batt"></div><div class="pw"><button class="ibtn" data-q="settings" title="Settings">${icon('gear',17)}</button><button class="ibtn" data-q="lock" title="Lock">${icon('lock',17)}</button></div></div>`;
  $('#q-tiles').addEventListener('click',e=>{
    const t=e.target.closest('[data-k]');
    if(!t)return;
    const k=t.dataset.k;
    if(k==='wifi'){setS({wifi:!S.wifi});toast({title:S.wifi?'Wi-Fi connected':'Wi-Fi turned off',msg:S.wifi?'Connected to DESKTOP Network':'Browser pages outside this device are unavailable.',icon:S.wifi?'wifi':'wifiOff',force:true})}
    else if(k==='dark')toggleTheme();
    else if(k==='night')setS({night:!S.night});
    else if(k==='dnd')setS({dnd:!S.dnd});
  });
  $('#q-vol').addEventListener('input',e=>setS({volume:+e.target.value,muted:false}));
  $('#q-bri').addEventListener('input',e=>setS({brightness:+e.target.value}));
  $('#q-mute').addEventListener('click',()=>setS({muted:!S.muted}));
  $('#quick').addEventListener('click',e=>{
    const b=e.target.closest('[data-q]');
    if(!b)return;
    closePanels();
    if(b.dataset.q==='settings')wm.open('settings');
    else sysAction('lock');
  });
  syncQuick();
}
function syncQuick(){
  const dark=resolvedTheme()==='dark';
  const tiles=[
    {k:'wifi',label:'Wi-Fi',sub:S.wifi?'Connected':'Off',ic:S.wifi?'wifi':'wifiOff',on:S.wifi},
    {k:'dark',label:'Dark mode',sub:dark?'On':'Off',ic:'moon',on:dark},
    {k:'night',label:'Night light',sub:S.night?'On':'Off',ic:'sun',on:S.night},
    {k:'dnd',label:'Quiet mode',sub:S.dnd?'On':'Off',ic:S.dnd?'bellOff':'bell',on:S.dnd}
  ];
  $('#q-tiles').innerHTML=tiles.map(t=>`<button class="q-tile${t.on?' on':''}" data-k="${t.k}">${icon(t.ic,18)}<span class="qt"><b>${t.label}</b><span>${t.sub}</span></span></button>`).join('');
  const v=$('#q-vol'),b=$('#q-bri');
  const vv=S.muted?0:S.volume;
  if(+v.value!==vv){v.value=vv;rangeFill(v)}
  if(+b.value!==S.brightness){b.value=S.brightness;rangeFill(b)}
  rangeFill(v);rangeFill(b);
  $('#q-volv').textContent=vv+'%';
  $('#q-briv').textContent=S.brightness+'%';
  $('#q-mute').innerHTML=icon(S.muted||S.volume===0?'volumeX':'volume',17);
  $('#q-batt').innerHTML=batteryIcon(batt.level,batt.charging)+`<span>${Math.round(batt.level*100)}%${batt.charging?' charging':''}</span>`;
}
function renderTray(){
  const vol=S.muted||S.volume===0?'volumeX':'volume';
  $('#tray-sys').innerHTML=`<span class="hide-sm">${icon(S.wifi?'wifi':'wifiOff',18)}</span><span class="hide-sm">${icon(vol,18)}</span>${batteryIcon(batt.level,batt.charging)}`;
}
bus.on('settings',()=>{syncQuick();renderTray();syncUser();tick()});
bus.on('tray',()=>{syncQuick();renderTray()});

let calView=new Date(),calSel=null;
function buildCalendar(){
  $('#calendar').innerHTML=`<div class="cal-head"><div class="cal-time" id="cal-time"></div><div class="cal-date" id="cal-date"></div></div><div class="cal-nav"><button class="ibtn" data-c="prev" title="Previous month">${icon('chevL',16)}</button><b id="cal-title"></b><button class="ibtn" data-c="next" title="Next month">${icon('chevR',16)}</button></div><div class="cal-grid" id="cal-grid"></div><div class="cal-foot"><button class="btn" data-c="today">Today</button></div>`;
  $('#calendar').addEventListener('click',e=>{
    const b=e.target.closest('[data-c]');
    if(b){
      const c=b.dataset.c;
      if(c==='prev')calView=new Date(calView.getFullYear(),calView.getMonth()-1,1);
      else if(c==='next')calView=new Date(calView.getFullYear(),calView.getMonth()+1,1);
      else{calView=new Date();calSel=null}
      renderCalendar();
      return;
    }
    const d=e.target.closest('[data-day]');
    if(d){calSel=+d.dataset.day;renderCalendar()}
  });
  renderCalendar();
}
function renderCalendar(){
  const y=calView.getFullYear(),m=calView.getMonth(),now=new Date();
  const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
  let html=['S','M','T','W','T','F','S'].map(d=>`<div class="wd">${d}</div>`).join('');
  for(let i=0;i<first;i++)html+='<div class="cal-d blank"></div>';
  for(let d=1;d<=days;d++){
    const today=d===now.getDate()&&m===now.getMonth()&&y===now.getFullYear();
    html+=`<button class="cal-d${today?' today':''}${calSel===d&&!today?' sel':''}" data-day="${d}">${d}</button>`;
  }
  $('#cal-grid').innerHTML=html;
  $('#cal-title').textContent=calView.toLocaleDateString([],{month:'long',year:'numeric'});
}
function tick(){
  const d=new Date();
  $('#tb-time').textContent=fmtClock(d,S.seconds);
  const ds=$('#tb-date');
  ds.textContent=d.toLocaleDateString([],{month:'short',day:'numeric',year:'numeric'});
  ds.style.display=S.showDate?'':'none';
  $('#lock-time').textContent=fmtClock(d,false).replace(/\s?[AP]M$/i,'');
  $('#lock-date').textContent=d.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'});
  const ct=$('#cal-time');
  if(ct){
    ct.textContent=fmtClock(d,true);
    $('#cal-date').textContent=d.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric',year:'numeric'});
  }
}
onPanelOpen.calendar=()=>{calView=new Date();calSel=null;renderCalendar();tick()};
onPanelOpen.quick=syncQuick;

bus.on('music',st=>{
  const np=$('#np');
  np.classList.toggle('hidden',!st||!st.playing);
  if(st&&st.playing)np.innerHTML=`<span class="np-bars"><i></i><i></i><i></i></span><span class="np-t"><b>${esc(st.title)}</b><span>${esc(st.artist)}</span></span>`;
});

const sys={locked:true,first:true,booting:false};
function startBoot(label){
  sys.booting=true;
  const b=$('#boot');
  b.classList.remove('hidden','done');
  $('#boot-logo').innerHTML=logo(88);
  const bar=$('#boot-bar i');
  bar.style.transition='none';
  bar.style.width='0';
  void bar.offsetWidth;
  bar.style.transition='width 2.6s cubic-bezier(.4,.1,.2,1)';
  bar.style.width='100%';
  const msgs=[label||'Starting DESKTOP','Mounting local storage','Loading wallpapers','Starting window manager','Ready'];
  msgs.forEach((m,i)=>setTimeout(()=>{$('#boot-status').textContent=m},i*560));
  setTimeout(()=>{
    b.classList.add('done');
    sys.booting=false;
    showLock();
    setTimeout(()=>b.classList.add('hidden'),750);
  },2950);
}
function showLock(){
  closePanels();closeMenu();
  const l=$('#lock');
  l.classList.remove('hidden');
  l.classList.add('unlocking');
  void l.offsetWidth;
  l.classList.remove('unlocking');
  sys.locked=true;
  tick();
  $('#lock-status').innerHTML=`${icon(S.wifi?'wifi':'wifiOff',18)}${batteryIcon(batt.level,batt.charging)}`;
}
function unlock(){
  if(!sys.locked||sys.booting)return;
  sys.locked=false;
  const l=$('#lock');
  l.classList.add('unlocking');
  setTimeout(()=>{if(!sys.locked)l.classList.add('hidden')},animOn()?780:0);
  if(sys.first){
    sys.first=false;
    setTimeout(()=>toast({title:'Welcome back, '+S.username,msg:'Right click the desktop to get started.',icon:'user'}),700);
  }
}
$('#lock-enter').addEventListener('click',e=>{e.stopPropagation();unlock()});
$('#lock').addEventListener('click',unlock);
document.addEventListener('keydown',e=>{if(sys.locked&&!sys.booting&&!$('#lock').classList.contains('hidden')){e.preventDefault();unlock()}},true);
function sysAction(a){
  if(a==='lock')showLock();
  else if(a==='restart'){
    wm.closeAll();closePanels();
    $('#lock').classList.add('hidden');
    sys.locked=true;sys.first=true;
    startBoot('Restarting');
  }else if(a==='off'){
    wm.closeAll();closePanels();
    $('#lock').classList.add('hidden');
    sys.locked=true;sys.first=true;
    $('#off').classList.remove('hidden');
  }
}
$('#off-btn').innerHTML=icon('power',26);
$('#off-btn').addEventListener('click',()=>{
  $('#off').classList.add('hidden');
  startBoot('Powering on');
});
</script>
<script>
addStyle(`
