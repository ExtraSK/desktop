.ed-area{flex:1;resize:none;border:0;outline:0;background:transparent;color:var(--text);padding:16px 18px;font-family:var(--mono);font-size:13.5px;line-height:1.65;tab-size:2}
.ed-foot{padding:6px 14px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}
`);

let fmDrag=null;
APP_IMPL.files={w:880,h:560,minW:380,minH:300,create(win,opts){
  const st={cwd:fs.get(opts.folder)?opts.folder:'root',hist:[],hi:-1,sel:new Set(),view:store.get('files.view','grid'),q:'',sort:{k:'name',d:1},order:[],anchor:null};
  const places=[['root','Home','home'],['desktop','Desktop','monitor'],['documents','Documents','file'],['pictures','Pictures','image'],['music','Music','music'],['downloads','Downloads','download']];
  win.body.innerHTML=`<div class="fm" tabindex="-1">
    <div class="fm-top">
      <button class="ibtn" data-a="back" title="Back">${icon('arrowL',17)}</button>
      <button class="ibtn" data-a="fwd" title="Forward">${icon('arrowR',17)}</button>
      <button class="ibtn" data-a="up" title="Up one level">${icon('arrowU',17)}</button>
      <div class="fm-path"></div>
      <input class="field fm-search" placeholder="Search" spellcheck="false">
      <button class="ibtn" data-a="view" title="Switch view"></button>
    </div>
    <div class="fm-act">
      <button class="act" data-a="newFolder" title="New folder">${icon('folderPlus',16)}<span>New folder</span></button>
      <button class="act" data-a="newFile" title="New file">${icon('filePlus',16)}<span>New file</span></button>
      <i class="vsep"></i>
      <button class="act" data-a="cut" title="Cut">${icon('scissors',16)}<span>Cut</span></button>
      <button class="act" data-a="copy" title="Copy">${icon('copy',16)}<span>Copy</span></button>
      <button class="act" data-a="paste" title="Paste">${icon('clipboard',16)}<span>Paste</span></button>
      <i class="vsep"></i>
      <button class="act" data-a="rename" title="Rename">${icon('pencil',16)}<span>Rename</span></button>
      <button class="act danger" data-a="delete" title="Delete">${icon('trash',16)}<span>Delete</span></button>
      <button class="act" data-a="restore" title="Restore">${icon('undo',16)}<span>Restore</span></button>
      <button class="act danger" data-a="empty" title="Empty Trash">${icon('trash',16)}<span>Empty Trash</span></button>
    </div>
    <div class="fm-main">
      <div class="fm-side">
        <div class="side-title">Places</div>
        ${places.map(p=>`<button class="side-item" data-go="${p[0]}" title="${p[1]}">${icon(p[2],16)}<span>${p[1]}</span></button>`).join('')}
        <div class="side-title" style="margin-top:8px">System</div>
        <button class="side-item" data-go="trash" title="Trash">${icon('trash',16)}<span>Trash</span></button>
      </div>
      <div class="fm-content" tabindex="0"></div>
    </div>
    <div class="fm-status"><span class="s-count"></span><span class="s-sel"></span></div>
  </div>`;
  const root=$('.fm',win.body),content=$('.fm-content',root),pathEl=$('.fm-path',root),search=$('.fm-search',root);

  function crumbs(){
    const chain=[];
    let n=fs.get(st.cwd);
    while(n){chain.unshift(n);n=fs.get(n.parent)}
    return chain;
  }
  function items(){
    let list=fs.kids(st.cwd);
    if(st.q)list=list.filter(n=>n.name.toLowerCase().includes(st.q.toLowerCase()));
    const {k,d}=st.sort;
    list.sort((a,b)=>{
      if(a.type!==b.type)return a.type==='folder'?-1:1;
      let r=0;
      if(k==='name')r=a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:'base'});
      else if(k==='mod')r=a.modified-b.modified;
      else if(k==='size')r=fs.size(a)-fs.size(b);
      else if(k==='kind')r=fs.kind(a).localeCompare(fs.kind(b));
      return r*d;
    });
    return list;
  }
  function sizeLabel(n){return n.type==='folder'?fs.size(n)+(fs.size(n)===1?' item':' items'):fmtBytes(fs.size(n))}
  function render(){
    const node=fs.get(st.cwd);
    win.setTitle(node.name+' · Files');
    const list=items();
    st.order=list.map(n=>n.id);
    st.sel=new Set(Array.from(st.sel).filter(id=>st.order.includes(id)));
    const cuts=clip.mode==='cut'?clip.ids:[];
    const chain=crumbs();
    pathEl.innerHTML=chain.map((n,i)=>`<button class="crumb" data-go="${n.id}">${esc(n.name)}</button>${i<chain.length-1?`<span class="crumb-sep">${icon('chevR',12)}</span>`:''}`).join('');
    $$('.side-item',root).forEach(b=>b.classList.toggle('on',b.dataset.go===st.cwd));
    $('[data-a=view]',root).innerHTML=icon(st.view==='grid'?'list':'grid',17);
    $('[data-a=view]',root).title=st.view==='grid'?'List view':'Grid view';
    if(!list.length){
      content.innerHTML=`<div class="fm-empty">${icon(st.cwd==='trash'?'trash':'folder',44,1.4)}${st.q?'No matching items':st.cwd==='trash'?'The Trash is empty':'This folder is empty'}</div>`;
    }else if(st.view==='grid'){
      content.innerHTML=`<div class="fm-grid">${list.map(n=>`<div class="fm-item${st.sel.has(n.id)?' sel':''}${cuts.includes(n.id)?' cut':''}" draggable="true" data-id="${n.id}" data-type="${n.type}" title="${esc(n.name)}"><span class="big-w">${n.type==='folder'?BIG_FOLDER:BIG_FILE}</span><span class="nm">${esc(n.name)}</span></div>`).join('')}</div>`;
    }else{
      const arrow=k=>st.sort.k===k?icon(st.sort.d>0?'chevU':'chevD',12):'';
      content.innerHTML=`<div class="fm-list"><div class="fm-row head"><button data-sort="name">Name ${arrow('name')}</button><button data-sort="mod">Modified ${arrow('mod')}</button><button data-sort="kind">Type ${arrow('kind')}</button><button data-sort="size">Size ${arrow('size')}</button></div>${list.map(n=>`<div class="fm-row${st.sel.has(n.id)?' sel':''}${cuts.includes(n.id)?' cut':''}" draggable="true" data-id="${n.id}" data-type="${n.type}"><div class="nm">${n.type==='folder'?BIG_FOLDER:BIG_FILE}<span>${esc(n.name)}</span></div><div class="c mod">${fmtStamp(n.modified)}</div><div class="c kind">${fs.kind(n)}</div><div class="c">${sizeLabel(n)}</div></div>`).join('')}</div>`;
    }
    syncBar();
  }
  function syncBar(){
    const inTrash=st.cwd==='trash';
    const one=st.sel.size===1,any=st.sel.size>0;
    const set=(a,on)=>$(`[data-a=${a}]`,root).classList.toggle('disabled',!on);
    const vis=(a,on)=>$(`[data-a=${a}]`,root).classList.toggle('hidden',!on);
    set('back',st.hi>0);set('fwd',st.hi<st.hist.length-1);
    set('up',!!(fs.get(st.cwd).parent)||inTrash);
    vis('newFolder',!inTrash);vis('newFile',!inTrash);vis('paste',!inTrash);vis('cut',!inTrash);vis('copy',!inTrash);vis('rename',!inTrash);
    vis('restore',inTrash);vis('empty',inTrash);
    set('cut',any);set('copy',any);set('paste',clip.ids.length>0);
    set('rename',one&&!SYSTEM_IDS.includes(Array.from(st.sel)[0]));
    set('delete',any);set('restore',any);set('empty',fs.kids('trash').length>0);
    $$('.fm-item,.fm-row:not(.head)',content).forEach(el=>el.classList.toggle('sel',st.sel.has(el.dataset.id)));
    const total=st.order.length;
    $('.s-count',root).textContent=total+(total===1?' item':' items');
    $('.s-sel',root).textContent=any?st.sel.size+' selected':'';
  }
  function go(id,push=true){
    if(!fs.get(id))return;
    if(push){st.hist=st.hist.slice(0,st.hi+1);st.hist.push(id);st.hi=st.hist.length-1}
    st.cwd=id;st.sel=new Set();st.q='';search.value='';st.anchor=null;
    render();
  }
  function selectOnly(id){st.sel=new Set([id]);st.anchor=id;syncBar()}
  function selected(){return Array.from(st.sel).map(id=>fs.get(id)).filter(Boolean)}
  async function newItem(type){
    const base=type==='folder'?'New Folder':'Untitled.txt';
    const name=await askName(type==='folder'?'New folder':'New file',fs.unique(st.cwd,base));
    if(name===null)return;
    const bad=fs.validName(name);
    if(bad){toast({title:'Could not create',msg:bad,icon:'info',force:true});return}
    const n=fs.create(st.cwd,name.trim(),type,'');
    st.sel=new Set([n.id]);render();
  }
  async function rename(){
    const n=selected()[0];
    if(!n||SYSTEM_IDS.includes(n.id))return;
    const v=await askName('Rename',n.name,'Rename');
    if(v===null)return;
    const err=fs.rename(n.id,v);
    if(err)toast({title:'Could not rename',msg:err,icon:'info',force:true});
  }
  async function del(){
    const ns=selected().filter(n=>!SYSTEM_IDS.includes(n.id));
    if(!ns.length)return;
    if(st.cwd==='trash'){
      if(await confirmBox('Delete permanently',ns.length===1?`"${ns[0].name}" will be deleted forever.`:`${ns.length} items will be deleted forever.`,'Delete')){
        ns.forEach(n=>fs.purge(n.id));st.sel=new Set();
      }
    }else{
      ns.forEach(n=>fs.trash(n.id));
      st.sel=new Set();
      toast({title:'Moved to Trash',msg:ns.length===1?ns[0].name:ns.length+' items',icon:'trash'});
    }
  }
  function doClip(mode){
    const ids=selected().filter(n=>!SYSTEM_IDS.includes(n.id)).map(n=>n.id);
    if(!ids.length)return;
    clip={ids,mode};render();
    toast({title:mode==='cut'?'Cut':'Copied',msg:ids.length===1?fs.get(ids[0]).name:ids.length+' items',icon:mode==='cut'?'scissors':'copy'});
  }
  function doPaste(){
    if(!clip.ids.length)return;
    const n=pasteInto(st.cwd);
    if(n)toast({title:'Pasted '+n+(n>1?' items':' item'),icon:'clipboard'});
    render();
  }
  function restore(){
    const ns=selected();
    ns.forEach(n=>fs.restore(n.id));
    if(ns.length)toast({title:'Restored',msg:ns.length===1?ns[0].name:ns.length+' items',icon:'undo'});
  }
  async function empty(){
    if(!fs.kids('trash').length)return;
    if(await confirmBox('Empty Trash','All items in the Trash will be permanently deleted.','Empty Trash')){fs.emptyTrash();toast({title:'Trash emptied',icon:'trash'})}
  }
  function open(n){
    if(n.type==='folder'&&st.cwd!=='trash')go(n.id);
    else openNode(n);
  }
  const actions={
    back(){if(st.hi>0){st.hi--;go(st.hist[st.hi],false)}},
    fwd(){if(st.hi<st.hist.length-1){st.hi++;go(st.hist[st.hi],false)}},
    up(){const n=fs.get(st.cwd);go(n.parent||'root')},
    view(){st.view=st.view==='grid'?'list':'grid';store.set('files.view',st.view);render()},
    newFolder:()=>newItem('folder'),newFile:()=>newItem('file'),
    cut:()=>doClip('cut'),copy:()=>doClip('copy'),paste:doPaste,rename,delete:del,restore,empty
  };
  root.addEventListener('click',e=>{
    const a=e.target.closest('[data-a]');
    if(a&&!a.classList.contains('disabled')){actions[a.dataset.a]();return}
    const g=e.target.closest('[data-go]');
    if(g){go(g.dataset.go);return}
    const s=e.target.closest('[data-sort]');
    if(s){const k=s.dataset.sort;st.sort=st.sort.k===k?{k,d:-st.sort.d}:{k,d:1};render();return}
    const it=e.target.closest('[data-id]');
    if(it&&content.contains(it)){
      const id=it.dataset.id;
      if(e.ctrlKey||e.metaKey){st.sel.has(id)?st.sel.delete(id):st.sel.add(id);st.anchor=id;syncBar()}
      else if(e.shiftKey&&st.anchor){
        const a1=st.order.indexOf(st.anchor),a2=st.order.indexOf(id);
        st.sel=new Set(st.order.slice(Math.min(a1,a2),Math.max(a1,a2)+1));syncBar();
      }else selectOnly(id);
      return;
    }
    if(content.contains(e.target)){st.sel=new Set();st.anchor=null;syncBar()}
  });
  content.addEventListener('dblclick',e=>{
    const it=e.target.closest('[data-id]');
    if(it)open(fs.get(it.dataset.id));
  });
  content.addEventListener('contextmenu',e=>{
    const it=e.target.closest('[data-id]');
    const inTrash=st.cwd==='trash';
    if(it){
      if(!st.sel.has(it.dataset.id))selectOnly(it.dataset.id);
      const ns=selected(),one=ns.length===1;
      const prot=ns.some(n=>SYSTEM_IDS.includes(n.id));
      const items=[{label:'Open',icon:'arrowR',disabled:!one,action:()=>open(ns[0])}];
      if(inTrash)items.push({label:'Restore',icon:'undo',action:restore},{sep:true},{label:'Delete permanently',icon:'trash',danger:true,action:del});
      else items.push({sep:true},
        {label:'Rename',icon:'pencil',shortcut:'F2',disabled:!one||prot,action:rename},
        {label:'Cut',icon:'scissors',shortcut:'Ctrl+X',disabled:prot,action:()=>doClip('cut')},
        {label:'Copy',icon:'copy',shortcut:'Ctrl+C',disabled:prot,action:()=>doClip('copy')},
        {sep:true},
        {label:'Move to Trash',icon:'trash',danger:true,shortcut:'Del',disabled:prot,action:del});
      showMenu(e.clientX,e.clientY,items);
    }else{
      st.sel=new Set();syncBar();
      const items=inTrash?[{label:'Empty Trash',icon:'trash',danger:true,disabled:!fs.kids('trash').length,action:empty}]:[
        {label:'New folder',icon:'folderPlus',action:()=>newItem('folder')},
        {label:'New text file',icon:'filePlus',action:()=>newItem('file')},
        {label:'Paste',icon:'clipboard',shortcut:'Ctrl+V',disabled:!clip.ids.length,action:doPaste},
        {sep:true},
        {label:st.view==='grid'?'List view':'Grid view',icon:st.view==='grid'?'list':'grid',action:actions.view},
        {label:'Refresh',icon:'refresh',action:render}
      ];
      showMenu(e.clientX,e.clientY,items);
    }
  });
  content.addEventListener('keydown',e=>{
    const k=e.key,mod=e.ctrlKey||e.metaKey;
    if(k==='Enter'&&st.sel.size===1){open(selected()[0])}
    else if(k==='F2'){e.preventDefault();rename()}
    else if(k==='Delete'){e.preventDefault();del()}
    else if(mod&&k.toLowerCase()==='a'){e.preventDefault();st.sel=new Set(st.order);syncBar()}
    else if(mod&&k.toLowerCase()==='c'&&st.cwd!=='trash'){e.preventDefault();doClip('copy')}
    else if(mod&&k.toLowerCase()==='x'&&st.cwd!=='trash'){e.preventDefault();doClip('cut')}
    else if(mod&&k.toLowerCase()==='v'&&st.cwd!=='trash'){e.preventDefault();doPaste()}
    else if(k==='Backspace'){e.preventDefault();actions.up()}
    else if(['ArrowRight','ArrowDown','ArrowLeft','ArrowUp'].includes(k)&&st.order.length){
      e.preventDefault();
      const cur=st.order.indexOf(st.anchor);
      const dir=(k==='ArrowRight'||k==='ArrowDown')?1:-1;
      const ni=clamp(cur<0?0:cur+dir,0,st.order.length-1);
      selectOnly(st.order[ni]);
      const el=$(`[data-id="${st.order[ni]}"]`,content);
      if(el)el.scrollIntoView({block:'nearest'});
    }
  });
  search.addEventListener('input',()=>{st.q=search.value.trim();render()});
  content.addEventListener('dragstart',e=>{
    const it=e.target.closest('[data-id]');
    if(!it)return;
    if(!st.sel.has(it.dataset.id))selectOnly(it.dataset.id);
    fmDrag=Array.from(st.sel).filter(id=>!SYSTEM_IDS.includes(id));
    if(!fmDrag.length){e.preventDefault();return}
    e.dataTransfer.effectAllowed='move';
    e.dataTransfer.setData('text/plain',fmDrag.join(','));
  });
  content.addEventListener('dragend',()=>{fmDrag=null;$$('.drop',root).forEach(x=>x.classList.remove('drop'))});
  function dropTarget(e){
    const t=e.target.closest('.fm-item[data-type=folder],.fm-row[data-type=folder],.side-item,.crumb');
    if(t&&t.dataset.go)return {el:t,id:t.dataset.go};
    if(t&&t.dataset.id)return {el:t,id:t.dataset.id};
    if(content.contains(e.target)&&st.cwd!=='trash')return {el:content,id:st.cwd};
    return null;
  }
  root.addEventListener('dragover',e=>{
    if(!fmDrag)return;
    const t=dropTarget(e);
    $$('.drop',root).forEach(x=>{if(!t||x!==t.el)x.classList.remove('drop')});
    if(t&&!fmDrag.includes(t.id)){e.preventDefault();e.dataTransfer.dropEffect='move';t.el.classList.add('drop')}
  });
  root.addEventListener('dragleave',e=>{if(!root.contains(e.relatedTarget))$$('.drop',root).forEach(x=>x.classList.remove('drop'))});
  root.addEventListener('drop',e=>{
    if(!fmDrag)return;
    e.preventDefault();
    const t=dropTarget(e);
    $$('.drop',root).forEach(x=>x.classList.remove('drop'));
    if(!t)return;
    const n=moveItems(fmDrag,t.id);
    fmDrag=null;
    if(n)toast({title:t.id==='trash'?'Moved to Trash':'Moved '+n+(n>1?' items':' item'),msg:'To '+fs.get(t.id).name,icon:t.id==='trash'?'trash':'folderPlus'});
  });
  win.listen('fs',()=>{if(!fs.get(st.cwd))go('root');else render()});
  win.listen('fs:content',render);
  go(st.cwd);
  setTimeout(()=>content.focus(),30);
}};

APP_IMPL.editor={w:660,h:480,minW:320,minH:240,
  find:(w,o)=>w.fileId===o.id,
  create(win,opts){
    const node=fs.get(opts.id);
    if(!node||node.type!=='file'){setTimeout(()=>win.close(),0);return}
    win.fileId=node.id;
    win.body.innerHTML=`<div class="ed"><div class="ed-bar"><span class="ed-name">${icon('file',15)}<span class="en"></span></span><span class="es">Saved</span></div><textarea class="ed-area" spellcheck="false"></textarea><div class="ed-foot"><span class="ec"></span></div></div>`;
    const area=$('.ed-area',win.body),status=$('.es',win.body),count=$('.ec',win.body);
    area.value=node.content||'';
    const stats=()=>{
      const v=area.value;
      const words=v.trim()?v.trim().split(/\s+/).length:0;
      count.textContent=`${words} ${words===1?'word':'words'}, ${v.length} characters`;
    };
    const names=()=>{$('.en',win.body).textContent=node.name;win.setTitle(node.name+' · Text Editor')};
    names();stats();
    let t=null;
    area.addEventListener('input',()=>{
      status.textContent='Saving...';
      stats();
      clearTimeout(t);
      t=setTimeout(()=>{
        const n=fs.get(node.id);
        if(!n)return;
        n.content=area.value;n.modified=Date.now();
        fs.save(true);
        status.textContent='Saved';
      },350);
    });
    area.addEventListener('keydown',e=>{
      if(e.key==='Tab'){
        e.preventDefault();
        const s=area.selectionStart;
        area.setRangeText('  ',s,area.selectionEnd,'end');
        area.dispatchEvent(new Event('input'));
      }
    });
    win.onClose(()=>{
      clearTimeout(t);
      const n=fs.get(node.id);
      if(n&&n.content!==area.value){n.content=area.value;n.modified=Date.now();fs.save(true)}
    });
    win.listen('fs',()=>{
      const n=fs.get(node.id);
      if(!n||fs.isTrashed(n.id)){win.close();return}
      names();
    });
    setTimeout(()=>area.focus(),60);
  }
};
</script>

.br{display:flex;flex-direction:column;height:100%}
.br-tabs{display:flex;align-items:flex-end;gap:2px;padding:6px 8px 0;background:rgba(0,0,0,.12);overflow-x:auto;scrollbar-width:none}
.br-tab{display:flex;align-items:center;gap:8px;height:34px;padding:0 6px 0 12px;border-radius:10px 10px 0 0;min-width:0;width:200px;max-width:200px;flex:0 1 200px;font-size:12.5px;color:var(--muted);transition:background .12s}
.br-tab:hover{background:var(--surface)}
.br-tab.on{background:var(--win-solid,rgba(128,128,160,.16));color:var(--text);background:var(--surface-3)}
.br-tab .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.br-tab .tx{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
.br-tab .tx:hover{background:var(--surface-3);color:var(--text)}
.br-new{margin-bottom:3px}
.br-bar{display:flex;align-items:center;gap:4px;padding:6px 8px;border-bottom:1px solid var(--border);background:var(--surface-3)}
.br-addr{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:34px;border-radius:17px;background:var(--input);border:1px solid var(--border);padding:0 6px 0 12px;color:var(--muted)}
.br-addr:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.br-addr input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font-size:13px}
.br-bm{display:flex;gap:4px;padding:5px 8px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;min-height:36px;align-items:center}
.bm{display:flex;align-items:center;gap:7px;padding:4px 10px;border-radius:8px;font-size:12.5px;white-space:nowrap;color:var(--muted);transition:background .12s}
.bm:hover{background:var(--surface-2);color:var(--text)}
.bm-hint{font-size:12px;color:var(--faint);padding:0 6px}
.br-view{flex:1;min-height:0;overflow:auto;position:relative;background:var(--input)}
.br-load{position:sticky;top:0;height:2px;width:100%;z-index:2;pointer-events:none}
.br-load i{display:block;height:100%;width:0;background:var(--accent)}
.br-load.go i{animation:brload .45s ease-out forwards}
@keyframes brload{0%{width:0;opacity:1}80%{width:100%;opacity:1}100%{width:100%;opacity:0}}
.bp{max-width:900px;margin:0 auto;padding:44px 28px 60px;line-height:1.6;user-select:text;-webkit-user-select:text}
.bp h1{font-size:30px;font-weight:600;margin:0 0 6px;letter-spacing:-.02em}
.bp h2{font-size:18px;font-weight:600;margin:30px 0 10px}
.bp h3{font-size:14px;font-weight:600;margin:0 0 4px}
.bp p{color:var(--muted);margin:0 0 12px}
.bp a,.bp .lnk{color:var(--accent-strong);cursor:pointer}
.bp a:hover,.bp .lnk:hover{text-decoration:underline}
.bp code{font-family:var(--mono);font-size:12.5px;padding:2px 6px;border-radius:5px;background:var(--surface-2)}
.bp-hero{text-align:center;padding:30px 0 10px}
.bp-hero .lg{display:inline-block;margin-bottom:14px}
.bp-search{display:flex;gap:8px;max-width:520px;margin:20px auto 0}
.bp-search input{flex:1;height:44px;border-radius:22px;padding:0 20px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);outline:0;font-size:14px}
.bp-search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.bp-search .btn{height:44px;border-radius:22px;padding:0 22px}
.bp-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin-top:34px}
.bp-tile{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 10px;border-radius:14px;background:var(--surface);border:1px solid var(--border);font-size:13px;transition:background .15s,transform .15s}
.bp-tile:hover{background:var(--surface-2);transform:translateY(-2px)}
.bp-tile span.ti{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-strong)}
.bp-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:22px}
.bp-card{padding:16px 18px;border-radius:14px;background:var(--surface);border:1px solid var(--border)}
.bp-card .n{font-size:26px;font-weight:300;letter-spacing:-.02em}
.bp-card .l{font-size:12px;color:var(--muted)}
.bp-sec{padding:16px 18px;border-radius:14px;background:var(--surface);border:1px solid var(--border);margin-bottom:10px;display:flex;gap:16px;align-items:flex-start;justify-content:space-between}
.bp-sec p{margin:0}
.bp-gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.bp-wp{border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.bp-wp .th{height:116px;background-size:cover;background-position:center}
.bp-wp .ft{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;font-size:13px}
.bp-res{display:block;padding:12px 4px;border-bottom:1px solid var(--border)}
.bp-res b{display:block;color:var(--accent-strong);font-weight:500;font-size:15px}
.bp-res span{color:var(--muted);font-size:13px}
.bp-res:hover b{text-decoration:underline}
.bp-center{text-align:center;padding-top:70px}
.bp-center svg{margin:0 auto 18px;opacity:.55}
.bp-kv{display:grid;grid-template-columns:150px 1fr;gap:8px 16px;font-size:13.5px;margin-top:10px}
.bp-kv dt{color:var(--muted)}
.bp-kv dd{margin:0}
.bp pre{font-family:var(--mono);font-size:12px;line-height:1.3;color:var(--accent-strong);overflow:auto}
`);

let bookmarks=store.get('browser.bookmarks',null);
if(!Array.isArray(bookmarks)){
  bookmarks=[{title:'Home',url:'desktop://home'},{title:'Documentation',url:'desktop://docs'},{title:'Wallpapers',url:'desktop://gallery'},{title:'About',url:'desktop://about'}];
  store.set('browser.bookmarks',bookmarks);
}
const SITE=[
  {url:'desktop://home',title:'New Tab',desc:'The DESKTOP start page',kw:'start home new tab'},
  {url:'desktop://docs',title:'Documentation',desc:'Guides, shortcuts and terminal commands',kw:'help manual commands shortcuts guide docs'},
  {url:'desktop://gallery',title:'Wallpaper Gallery',desc:'Preview and apply wallpapers',kw:'wallpaper background images gallery'},
  {url:'desktop://notes',title:'Your Notes',desc:'Every note stored on this device',kw:'notes writing'},
  {url:'desktop://about',title:'About DESKTOP',desc:'Version and storage details',kw:'about version system storage info'}
];
const appBlurb={
  files:'Browse folders, create, rename, copy, cut and paste items, drag things between folders and restore deleted items from the Trash.',
  browser:'This browser. Tabs, bookmarks and history all work, and pages are served locally from DESKTOP itself.',
  notes:'Create as many notes as you want. They save automatically and can be searched or exported as text files.',
  terminal:'A simulated shell connected to the same files you see in the Files app. Type help to list the commands.',
  settings:'Wallpapers, accent colors, light and dark themes, clock format, desktop behavior and data management.',
  calculator:'A standard calculator with keyboard support and a history of recent results.',
  music:'Five generated tracks with a live visualizer, playlist, shuffle, repeat and volume control.'
};
function normUrl(v){
  v=(v||'').trim();
  if(!v)return 'desktop://home';
  if(/^desktop:\/\//i.test(v)){
    const i=v.indexOf('?');
    const base=(i<0?v:v.slice(0,i)).replace(/\/+$/,'').toLowerCase();
    return base+(i<0?'':v.slice(i));
  }
  if(/^https?:\/\//i.test(v))return v;
  if(!/\s/.test(v)&&/^[\w-]+(\.[\w-]+)+(:\d+)?(\/\S*)?$/.test(v))return 'https://'+v;
  return 'desktop://search?q='+encodeURIComponent(v);
}
function siteResults(q){
  const ql=q.toLowerCase();
  const out=[];
  SITE.forEach(s=>{if((s.title+' '+s.desc+' '+s.kw).toLowerCase().includes(ql))out.push({go:s.url,title:s.title,desc:s.desc})});
  Object.keys(appBlurb).forEach(a=>{if((APPS[a].name+' '+appBlurb[a]).toLowerCase().includes(ql))out.push({open:a,title:'Open '+APPS[a].name,desc:appBlurb[a]})});
  notes.forEach(n=>{if((n.title+' '+n.body).toLowerCase().includes(ql))out.push({note:n.id,title:n.title||'Untitled',desc:'Note: '+n.body.replace(/\s+/g,' ').slice(0,90)})});
  Object.values(fs.nodes).forEach(n=>{if(!SYSTEM_IDS.includes(n.id)&&!fs.isTrashed(n.id)&&n.name.toLowerCase().includes(ql))out.push({node:n.id,title:n.name,desc:'File in '+fs.path(n.parent)})});
  return out;
}
function pageHome(){
  const hr=new Date().getHours();
  const g=hr<5?'Good night':hr<12?'Good morning':hr<18?'Good afternoon':'Good evening';
  const fileN=Object.values(fs.nodes).filter(n=>n.type==='file'&&!fs.isTrashed(n.id)).length;
  const tile=(ic,label,attr)=>`<button class="bp-tile" ${attr}><span class="ti">${icon(ic,20)}</span>${label}</button>`;
  return {title:'New Tab',html:`<div class="bp"><div class="bp-hero"><span class="lg">${logo(56)}</span><h1>${g}, ${esc(S.username)}</h1><p>Everything on this page is served from your own device.</p><form class="bp-search"><input name="q" placeholder="Search pages, apps, notes and files" autocomplete="off" spellcheck="false"><button class="btn primary" type="submit">Search</button></form></div><div class="bp-tiles">${tile('file','Documentation','data-go="desktop://docs"')}${tile('image','Wallpapers','data-go="desktop://gallery"')}${tile('note','Your notes','data-go="desktop://notes"')}${tile('info','About','data-go="desktop://about"')}${tile('folder','Files','data-open="files"')}${tile('terminal','Terminal','data-open="terminal"')}${tile('music','Music','data-open="music"')}${tile('gear','Settings','data-open="settings"')}</div><div class="bp-cards"><div class="bp-card"><div class="n">${notes.length}</div><div class="l">Notes saved</div></div><div class="bp-card"><div class="n">${fileN}</div><div class="l">Files stored</div></div><div class="bp-card"><div class="n">${fmtBytes(store.bytes())}</div><div class="l">Local storage used</div></div></div></div>`};
}
function pageDocs(){
  const sec=a=>`<div class="bp-sec"><div><h3>${APPS[a].name}</h3><p>${appBlurb[a]}</p></div><button class="btn" data-open="${a}">Open</button></div>`;
  return {title:'Documentation',html:`<div class="bp"><h1>Documentation</h1><p>A short guide to everything inside DESKTOP.</p><h2>Applications</h2>${Object.keys(appBlurb).map(sec).join('')}<h2>Window management</h2><p>Drag a title bar to move a window, drag any edge or corner to resize it, and double click the title bar to maximize. Drop a window against the left, right or top edge of the screen to snap it. Click a taskbar icon to focus a window, click again to minimize it, and right click for more options.</p><h2>Terminal commands</h2><p><code>help</code> <code>ls</code> <code>cd</code> <code>pwd</code> <code>cat</code> <code>echo</code> <code>mkdir</code> <code>touch</code> <code>rm</code> <code>mv</code> <code>cp</code> <code>tree</code> <code>date</code> <code>whoami</code> <code>neofetch</code> <code>theme</code> <code>open</code> <code>ps</code> <code>clear</code> and a few surprises.</p><h2>Storage</h2><p>Settings, files, notes, bookmarks, icon positions and music preferences are stored in this browser using localStorage. Nothing leaves your device.</p></div>`};
}
function pageGallery(){
  const cards=WALLPAPERS.map(w=>`<div class="bp-wp"><div class="th" style="${esc('background-image:'+w.image+';background-color:'+w.color)}"></div><div class="ft"><span>${w.name}</span><button class="btn${S.wallpaper===w.id?'':' primary'}" data-wp="${w.id}">${S.wallpaper===w.id?'Applied':'Apply'}</button></div></div>`).join('');
  return {title:'Wallpaper Gallery',html:`<div class="bp"><h1>Wallpaper Gallery</h1><p>Preview a wallpaper and apply it to your desktop instantly.</p><div class="bp-gal">${cards}</div></div>`};
}
function pageNotes(){
  const rows=notes.slice().sort((a,b)=>b.updated-a.updated).map(n=>`<div class="bp-sec"><div><h3>${esc(n.title||'Untitled')}</h3><p>${esc(n.body.replace(/\s+/g,' ').slice(0,140)||'Empty note')}</p></div><button class="btn" data-note="${n.id}">Open</button></div>`).join('');
  return {title:'Your Notes',html:`<div class="bp"><h1>Your Notes</h1><p>${notes.length} ${notes.length===1?'note':'notes'} stored on this device.</p>${rows||'<p>You have no notes yet.</p>'}</div>`};
}
function pageAbout(){
  const files=Object.values(fs.nodes).filter(n=>n.type==='file'&&!fs.isTrashed(n.id)).length;
  const up=Math.floor((Date.now()-performance.timeOrigin)/1000);
  return {title:'About DESKTOP',html:`<div class="bp"><div style="display:flex;align-items:center;gap:18px">${logo(64)}<div><h1 style="margin:0">DESKTOP</h1><p style="margin:0">Version 1.0, a desktop that lives in a browser tab.</p></div></div><dl class="bp-kv"><dt>User</dt><dd>${esc(S.username)}</dd><dt>Theme</dt><dd>${resolvedTheme()==='dark'?'Dark':'Light'}</dd><dt>Wallpaper</dt><dd>${esc(currentWallpaper().name||'Custom image')}</dd><dt>Open windows</dt><dd>${wm.list.length}</dd><dt>Files</dt><dd>${files}</dd><dt>Notes</dt><dd>${notes.length}</dd><dt>Storage used</dt><dd>${fmtBytes(store.bytes())}</dd><dt>Session time</dt><dd>${Math.floor(up/60)} min ${up%60} s</dd><dt>Platform</dt><dd>${esc(navigator.platform||'Unknown')}</dd></dl><p style="margin-top:22px"><button class="btn" data-open="settings">Open Settings</button></p></div>`};
}
function pageSearch(q){
  const res=q?siteResults(q):[];
  const rows=res.map(r=>`<a class="bp-res" ${r.go?`data-go="${esc(r.go)}"`:r.open?`data-open="${r.open}"`:r.note?`data-note="${r.note}"`:`data-node="${r.node}"`}><b>${esc(r.title)}</b><span>${esc(r.desc)}</span></a>`).join('');
  return {title:'Search: '+q,html:`<div class="bp"><h1>Results for "${esc(q)}"</h1><p>${res.length} ${res.length===1?'match':'matches'} on this device.</p><form class="bp-search" style="margin:0 0 18px;max-width:none"><input name="q" value="${esc(q)}" autocomplete="off" spellcheck="false"><button class="btn primary" type="submit">Search</button></form>${rows||'<p>Nothing found. Try a different word.</p>'}</div>`};
}
function pageSecret(){
  return {title:'Secret',html:`<div class="bp bp-center"><pre style="display:inline-block;text-align:left">  _____________
 |  _________  |
 | |  HELLO  | |
 | |_________| |
 |_____________|
    _|_____|_
   |_________|</pre><h1>You found the hidden page</h1><p>Nobody links here. Congratulations on being curious.</p><p><button class="btn" data-matrix="1">Do not press this</button></p></div>`};
}
function pageMessage(title,ic,heading,text,extra){
  return {title,html:`<div class="bp bp-center">${icon(ic,64,1.2)}<h1>${heading}</h1><p>${text}</p>${extra||''}<p><button class="btn" data-go="desktop://home">Go to the start page</button></p></div>`};
}
function route(url){
  const i=url.indexOf('?');
  const base=i<0?url:url.slice(0,i);
  const q=i<0?'':(new URLSearchParams(url.slice(i+1)).get('q')||'');
  switch(base){
    case 'desktop://home':return pageHome();
    case 'desktop://docs':return pageDocs();
    case 'desktop://gallery':return pageGallery();
    case 'desktop://notes':return pageNotes();
    case 'desktop://about':return pageAbout();
    case 'desktop://search':return pageSearch(q);
    case 'desktop://secret':return pageSecret();
  }
  if(/^desktop:\/\//.test(base))return pageMessage('Page not found','search','This page does not exist','There is nothing at <code>'+esc(url)+'</code>.');
  let host=url;
  try{host=new URL(url).hostname}catch(e){}
  if(!S.wifi)return pageMessage('No internet','wifiOff','You are offline','Wi-Fi is turned off, so <code>'+esc(host)+'</code> cannot be reached.','<p><button class="btn primary" data-wifi="1">Turn on Wi-Fi</button></p>');
  return pageMessage(host,'globe','External sites open outside DESKTOP','This browser serves local pages only. <code>'+esc(host)+'</code> can be opened in a new tab of your real browser.','<p><button class="btn primary" data-ext="'+esc(url)+'">Open in a real browser tab</button></p>');
}

APP_IMPL.browser={w:980,h:640,minW:420,minH:320,create(win,opts){
  win.body.innerHTML=`<div class="br"><div class="br-tabs"></div><div class="br-bar"><button class="ibtn" data-b="back" title="Back">${icon('arrowL',17)}</button><button class="ibtn" data-b="fwd" title="Forward">${icon('arrowR',17)}</button><button class="ibtn" data-b="reload" title="Reload">${icon('refresh',16)}</button><button class="ibtn" data-b="home" title="Home">${icon('home',16)}</button><div class="br-addr"><span class="ai"></span><input class="addr" spellcheck="false" autocomplete="off" placeholder="Search or enter an address"><button class="ibtn" data-b="star" title="Bookmark this page"></button></div></div><div class="br-bm"></div><div class="br-view"><div class="br-load"><i></i></div><div class="br-page"></div></div></div>`;
  const root=$('.br',win.body),tabsEl=$('.br-tabs',root),addr=$('.addr',root),view=$('.br-view',root),page=$('.br-page',root),bmEl=$('.br-bm',root),load=$('.br-load',root);
  let tabs=[],active=null;
  const newTab=url=>{
    const t={id:uid(),hist:[url],i:0,url,title:'New Tab'};
    tabs.push(t);active=t;show();
  };
  function renderTabs(){
    tabsEl.innerHTML=tabs.map(t=>`<div class="br-tab${t===active?' on':''}" data-id="${t.id}">${icon('globe',14)}<span class="tt">${esc(t.title)}</span><button class="tx" data-close="${t.id}" title="Close tab">${icon('x',13)}</button></div>`).join('')+`<button class="ibtn br-new" data-b="new" title="New tab">${icon('plus',16)}</button>`;
  }
  function renderBm(){
    bmEl.innerHTML=bookmarks.length?bookmarks.map((b,i)=>`<button class="bm" data-bm="${i}" title="${esc(b.url)}">${icon('bookmark',13)}<span>${esc(b.title)}</span></button>`).join(''):'<span class="bm-hint">Bookmarks you add with the star appear here.</span>';
    syncStar();
  }
  function syncStar(){
    const on=bookmarks.some(b=>b.url===active.url);
    const s=$('[data-b=star]',root);
    s.innerHTML=icon(on?'starFill':'star',16);
    s.classList.toggle('on',on);
    s.title=on?'Remove bookmark':'Bookmark this page';
  }
  function syncNav(){
    $('[data-b=back]',root).classList.toggle('disabled',active.i<=0);
    $('[data-b=fwd]',root).classList.toggle('disabled',active.i>=active.hist.length-1);
  }
  function show(){
    const r=route(active.url);
    active.title=r.title;
    page.innerHTML=r.html;
    view.scrollTop=0;
    addr.value=active.url;
    $('.ai',root).innerHTML=icon(/^desktop:/.test(active.url)?'lock':'globe',14);
    win.setTitle(r.title+' · Browser');
    load.classList.remove('go');void load.offsetWidth;load.classList.add('go');
    renderTabs();syncNav();syncStar();
  }
  function nav(url,push=true){
    if(push){active.hist=active.hist.slice(0,active.i+1);active.hist.push(url);active.i=active.hist.length-1}
    active.url=url;show();
  }
  function closeTab(id){
    const idx=tabs.findIndex(t=>t.id===id);
    if(idx<0)return;
    if(tabs.length===1){win.close();return}
    tabs.splice(idx,1);
    if(active.id===id)active=tabs[Math.max(0,idx-1)];
    show();
  }
  root.addEventListener('click',e=>{
    const b=e.target.closest('[data-b]');
    if(b&&!b.classList.contains('disabled')){
      const k=b.dataset.b;
      if(k==='back'&&active.i>0){active.i--;nav(active.hist[active.i],false)}
      else if(k==='fwd'&&active.i<active.hist.length-1){active.i++;nav(active.hist[active.i],false)}
      else if(k==='reload')show();
      else if(k==='home')nav('desktop://home');
      else if(k==='new'){if(tabs.length>=12)toast({title:'Too many tabs',msg:'Close one before opening another.',icon:'info'});else newTab('desktop://home')}
      else if(k==='star'){
        const i=bookmarks.findIndex(x=>x.url===active.url);
        if(i>=0){bookmarks.splice(i,1);toast({title:'Bookmark removed',icon:'star'})}
        else{bookmarks.push({title:active.title.replace(/^Search: /,'Search ').slice(0,28),url:active.url});toast({title:'Bookmark added',msg:active.title,icon:'star'})}
        store.set('browser.bookmarks',bookmarks);bus.emit('bookmarks');
      }
      return;
    }
    const x=e.target.closest('[data-close]');
    if(x){closeTab(x.dataset.close);return}
    const tab=e.target.closest('.br-tab');
    if(tab){active=tabs.find(t=>t.id===tab.dataset.id);show();return}
    const bm=e.target.closest('[data-bm]');
    if(bm){nav(bookmarks[+bm.dataset.bm].url);return}
    const go=e.target.closest('[data-go]');
    if(go&&page.contains(go)){nav(go.dataset.go);return}
    const op=e.target.closest('[data-open]');
    if(op){wm.open(op.dataset.open);return}
    const wp=e.target.closest('[data-wp]');
    if(wp){setS({wallpaper:wp.dataset.wp});show();return}
    const nt=e.target.closest('[data-note]');
    if(nt){wm.open('notes',{note:nt.dataset.note});return}
    const nd=e.target.closest('[data-node]');
    if(nd){openNode(fs.get(nd.dataset.node));return}
    const ex=e.target.closest('[data-ext]');
    if(ex){window.open(ex.dataset.ext,'_blank','noopener');return}
    if(e.target.closest('[data-wifi]')){setS({wifi:true});show();return}
    if(e.target.closest('[data-matrix]')){startMatrix()}
  });
  root.addEventListener('submit',e=>{
    e.preventDefault();
    const q=(new FormData(e.target).get('q')||'').toString().trim();
    nav('desktop://search?q='+encodeURIComponent(q));
  });
  tabsEl.addEventListener('auxclick',e=>{const t=e.target.closest('.br-tab');if(t&&e.button===1)closeTab(t.dataset.id)});
  addr.addEventListener('focus',()=>addr.select());
  addr.addEventListener('keydown',e=>{
    if(e.key==='Enter'){nav(normUrl(addr.value));addr.blur()}
    else if(e.key==='Escape'){addr.value=active.url;addr.blur()}
  });
  bmEl.addEventListener('contextmenu',e=>{
    const bm=e.target.closest('[data-bm]');
    if(!bm)return;
    const i=+bm.dataset.bm,b=bookmarks[i];
    showMenu(e.clientX,e.clientY,[
      {label:'Open',icon:'arrowR',action:()=>nav(b.url)},
      {label:'Open in new tab',icon:'plus',action:()=>newTab(b.url)},
      {sep:true},

APP_IMPL.notes={w:820,h:540,minW:380,minH:300,create(win,opts){
  let cur=null,q='',timer=null;
  win.body.innerHTML=`<div class="nt"><div class="nt-side"><div class="nt-tools"><input class="field nt-q" placeholder="Search notes" spellcheck="false"><button class="ibtn" data-n="new" title="New note">${icon('plus',18)}</button></div><div class="nt-list"></div></div><div class="nt-main"></div></div>`;
  const root=$('.nt',win.body),list=$('.nt-list',root),main=$('.nt-main',root),search=$('.nt-q',root);
  const byId=id=>notes.find(n=>n.id===id);
  function words(s){return s.trim()?s.trim().split(/\s+/).length:0}
  function renderList(){
    const ql=q.toLowerCase();
    const vis=notes.filter(n=>!ql||(n.title+' '+n.body).toLowerCase().includes(ql)).sort((a,b)=>b.updated-a.updated);
    list.innerHTML=vis.map(n=>`<button class="nt-item${n.id===cur?' on':''}" data-id="${n.id}"><b>${esc(n.title||'Untitled')}</b><span>${esc(n.body.split('\n').find(l=>l.trim())||'No additional text')}</span><small>${fmtStamp(n.updated)}</small></button>`).join('')||`<div class="empty-note">${q?'No matching notes':'No notes yet'}</div>`;
  }
  function renderMain(){
    const n=byId(cur);
    if(!n){
      main.innerHTML=`<div class="nt-empty"><div>${icon('note',48,1.2)}<span>${notes.length?'Select a note to start writing':'You have no notes yet'}</span><button class="btn primary" data-n="new">${icon('plus',15)} New note</button></div></div>`;
      return;
    }
    main.innerHTML=`<input class="nt-title" placeholder="Title" spellcheck="false" maxlength="120"><textarea class="nt-body" placeholder="Start writing..." spellcheck="true"></textarea><div class="nt-foot"><span class="nt-status"></span><div style="display:flex;gap:4px"><button class="ibtn" data-n="export" title="Export as text file">${icon('download',17)}</button><button class="ibtn" data-n="delete" title="Delete note">${icon('trash',17)}</button></div></div>`;
    $('.nt-title',main).value=n.title;
    $('.nt-body',main).value=n.body;
    status('Saved '+fmtStamp(n.updated));
    win.setTitle((n.title||'Untitled')+' · Notes');
  }
  function status(t){const s=$('.nt-status',main);if(s){const n=byId(cur);s.textContent=(n?words(n.body)+' words   ':'')+t}}
  function select(id){cur=id;renderList();renderMain()}
  function create(){
    const t=Date.now();
    const n={id:uid()+uid(),title:'',body:'',created:t,updated:t};
    notes.unshift(n);
    saveNotes(win.id);
    select(n.id);
    const ti=$('.nt-title',main);
    if(ti)ti.focus();
  }
  function commit(){
    const n=byId(cur);
    if(!n)return;
    n.title=$('.nt-title',main).value;
    n.body=$('.nt-body',main).value;
    n.updated=Date.now();
    saveNotes(win.id);
    renderList();
    status('Saved '+fmtStamp(n.updated));
    win.setTitle((n.title||'Untitled')+' · Notes');
  }
  main.addEventListener('input',()=>{
    const n=byId(cur);
    if(!n)return;
    status('Saving...');
    if($('.nt-title',main).value.trim().toLowerCase()==='xyzzy')toast({title:'Nothing happens.',icon:'info'});
    clearTimeout(timer);
    timer=setTimeout(commit,300);
  });
  win.onClose(()=>{if(timer){clearTimeout(timer);commit()}});
  root.addEventListener('click',async e=>{
    const it=e.target.closest('.nt-item');
    if(it){select(it.dataset.id);return}
    const b=e.target.closest('[data-n]');
    if(!b)return;
    const k=b.dataset.n;
    if(k==='new')create();
    else if(k==='export'){
      const n=byId(cur);if(!n)return;
      const blob=new Blob([(n.title?n.title+'\n\n':'')+n.body],{type:'text/plain'});
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download=((n.title||'Untitled').replace(/[\\\/:*?"<>|]/g,'')||'Untitled')+'.txt';
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    }else if(k==='delete'){
      const n=byId(cur);if(!n)return;
      if(await confirmBox('Delete note',`"${n.title||'Untitled'}" will be permanently deleted.`)){
        clearTimeout(timer);timer=null;
        notes=notes.filter(x=>x.id!==n.id);
        saveNotes(win.id);
        const next=notes.slice().sort((a,b)=>b.updated-a.updated)[0];
        select(next?next.id:null);
      }
    }
  });
  list.addEventListener('contextmenu',e=>{
    const it=e.target.closest('.nt-item');
    if(!it)return;
    const n=byId(it.dataset.id);
    showMenu(e.clientX,e.clientY,[
      {label:'Open',icon:'arrowR',action:()=>select(n.id)},
      {label:'Delete',icon:'trash',danger:true,action:async()=>{
        if(await confirmBox('Delete note',`"${n.title||'Untitled'}" will be permanently deleted.`)){
          notes=notes.filter(x=>x.id!==n.id);saveNotes(win.id);
          if(cur===n.id){const nx=notes[0];select(nx?nx.id:null)}else renderList();
        }
      }}
    ]);
  });
  search.addEventListener('input',()=>{q=search.value.trim();renderList()});
  win.listen('notes',src=>{
    if(src===win.id)return;
    if(cur&&!byId(cur)){select(notes[0]?notes[0].id:null);return}
    renderList();
    const n=byId(cur),ti=$('.nt-title',main);
    if(n&&ti&&!main.contains(document.activeElement)){ti.value=n.title;$('.nt-body',main).value=n.body;status('Saved '+fmtStamp(n.updated))}
  });
  const first=opts.note&&byId(opts.note)?opts.note:(notes.slice().sort((a,b)=>b.updated-a.updated)[0]||{}).id||null;
  select(first);
}};
</script>

APP_IMPL.terminal={w:780,h:480,minW:340,minH:240,create(win,opts){
  const st={cwd:fs.get(opts.cwd)?opts.cwd:'root',hist:store.get('term.history',[]),hi:null,busy:false,abort:false,start:Date.now()};
  win.body.innerHTML='<div class="tm"><div class="tm-out"></div><div class="tm-line"><span class="tm-ps"></span><input class="tm-in" spellcheck="false" autocomplete="off" autocapitalize="off"></div></div>';
  const tm=$('.tm',win.body),out=$('.tm-out',win.body),inp=$('.tm-in',win.body),ps=$('.tm-ps',win.body);
  const user=()=>S.username||'user';
  const cwdPath=()=>fs.path(st.cwd);
  function renderPs(){ps.innerHTML=`<span class="u">${esc(user())}@desktop</span>:<span class="p">${esc(cwdPath())}</span>$ `}
  function line(html,cls){
    const d=document.createElement('div');
    d.className='tl'+(cls?' '+cls:'');
    d.innerHTML=html;
    out.appendChild(d);
    while(out.children.length>600)out.firstChild.remove();
    tm.scrollTop=tm.scrollHeight;
  }
  const mkio=(buf)=>({
    print(t,cls){if(buf)buf.push(t);else line(esc(t),cls)},
    html(hh,plain){if(buf)buf.push(plain);else line(hh)},
    err(t){if(buf)buf.push(t);else line(esc(t),'e')}
  });
  function tokenize(s){
    const o=[];let cur='',q=null,has=false,gt=false;
    for(let i=0;i<s.length;i++){
      const c=s[i];
      if(q){if(c===q)q=null;else cur+=c;continue}
      if(c==='\\'&&i+1<s.length){cur+=s[++i];has=true;gt=false;continue}
      if(c==='"'||c==="'"){q=c;has=true;gt=false;continue}
      if(c==='>'){
        if(cur||has){o.push(cur);cur='';has=false}
        if(gt)o[o.length-1]='>>';else{o.push('>');gt=true}
        continue;
      }
      if(/\s/.test(c)){if(cur||has){o.push(cur);cur='';has=false}gt=false;continue}
      cur+=c;gt=false;
    }
    if(cur||has)o.push(cur);
    return o;
  }
  const expand=t=>t.replace(/\$(USER|HOME|PWD|SHELL)\b/g,(m,k)=>({USER:user(),HOME:'~',PWD:cwdPath(),SHELL:'dsh'}[k]));
  const toPath=n=>n.id===st.cwd?'.':fs.path(n.id);
  function need(io,cmd,p){
    const n=fs.resolve(p,st.cwd);
    if(!n)io.err(`${cmd}: ${p}: No such file or directory`);
    return n;
  }
  const CMDS={
    help:{d:'List commands, or show usage with help <command>',u:'help [command]',run(a,io){
      if(a[0]){
        const c=CMDS[a[0]];
        if(!c){io.err(`help: no help for '${a[0]}'`);return}
        io.print(`${a[0]}: ${c.d}`);io.print(`usage: ${c.u}`,'dim');return;
      }
      const names=Object.keys(CMDS).sort();
      const rows=names.map(n=>`<tr><td class="hl">${n}</td><td class="dim">${esc(CMDS[n].d)}</td></tr>`).join('');
      io.html(`<span class="pu">DESKTOP shell commands</span>\n<table>${rows}</table>`,names.join(' '));
    }},
    clear:{d:'Clear the terminal screen',u:'clear',run(){out.innerHTML=''}},
    date:{d:'Print the current date and time',u:'date',run(a,io){io.print(new Date().toLocaleString('en-US',{weekday:'short',month:'short',day:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,timeZoneName:'short'}).replace(',',''))}},
    whoami:{d:'Print the current user name',u:'whoami',run(a,io){io.print(user())}},
    hostname:{d:'Print the machine name',u:'hostname',run(a,io){io.print('desktop')}},
    uname:{d:'Print system information',u:'uname [-a]',run(a,io){io.print(a.includes('-a')?'DESKTOP 1.0.0 desktop-web x86_64 Browser':'DESKTOP')}},
    pwd:{d:'Print the working directory',u:'pwd',run(a,io){io.print(cwdPath())}},
    uptime:{d:'Show how long the session has been running',u:'uptime',run(a,io){
      const s=Math.floor((Date.now()-st.start)/1000),m=Math.floor(s/60);
      io.print(` ${new Date().toLocaleTimeString([],{hour12:false})} up ${m} min, ${s%60} sec, 1 user, load average: 0.04, 0.02, 0.00`);
    }},
    echo:{d:'Print text, optionally redirected with > or >>',u:'echo text [> file]',run(a,io){io.print(a.join(' '))}},
    ls:{d:'List directory contents',u:'ls [-l] [-a] [path]',run(a,io){
      const flags=a.filter(x=>x.startsWith('-')).join(''),paths=a.filter(x=>!x.startsWith('-'));
      const long=flags.includes('l');
      const targets=paths.length?paths:['.'];
      targets.forEach((p,ti)=>{
        const n=need(io,'ls',p);
        if(!n)return;
        if(targets.length>1)io.print((ti?'\n':'')+p+':');
        if(n.type==='file'){io.print(n.name);return}
        const kids=fs.kids(n.id);
        if(!kids.length&&!long)return;
        if(long){
          const rows=kids.map(k=>{
            const d=new Date(k.modified).toLocaleString('en-US',{month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).replace(',','');
            const sz=String(k.type==='folder'?4096:fs.size(k)).padStart(6);
            const nm=k.type==='folder'?`<span class="d">${esc(k.name)}/</span>`:esc(k.name);
            return {h:`${k.type==='folder'?'drwxr-xr-x':'-rw-r--r--'} 1 ${esc(user())} ${sz} ${d} ${nm}`,t:`${k.type==='folder'?'drwxr-xr-x':'-rw-r--r--'} 1 ${user()} ${sz} ${d} ${k.name}${k.type==='folder'?'/':''}`};
          });
          io.html(`<span class="dim">total ${kids.length}</span>\n`+rows.map(r=>r.h).join('\n'),rows.map(r=>r.t).join('\n'));
        }else{
          io.html(kids.map(k=>k.type==='folder'?`<span class="d">${esc(k.name)}</span>`:esc(k.name)).join('  '),kids.map(k=>k.name).join('\n'));
        }
      });
    }},
    cd:{d:'Change the working directory',u:'cd [path]',run(a,io){
      if(!a.length||a[0]==='~'){st.cwd='root';renderPs();return}
      const n=fs.resolve(a[0],st.cwd);
      if(!n)io.err(`cd: no such file or directory: ${a[0]}`);
      else if(n.type!=='folder')io.err(`cd: not a directory: ${a[0]}`);
      else{st.cwd=n.id;renderPs()}
    }},
    cat:{d:'Print file contents',u:'cat file...',run(a,io){
      if(!a.length){io.err('cat: missing file operand');return}
      a.forEach(p=>{
        const n=need(io,'cat',p);
        if(!n)return;
        if(n.type==='folder')io.err(`cat: ${p}: Is a directory`);
        else io.print(n.content.replace(/\n$/,''));
      });
    }},
    mkdir:{d:'Create directories',u:'mkdir [-p] name...',run(a,io){
      const names=a.filter(x=>!x.startsWith('-'));
      if(!names.length){io.err('mkdir: missing operand');return}
      names.forEach(p=>{
        const i=p.lastIndexOf('/'),dir=i>=0?p.slice(0,i)||'/':'.',nm=p.slice(i+1);
        const par=fs.resolve(dir,st.cwd);
        const bad=fs.validName(nm);
        if(!par||par.type!=='folder')io.err(`mkdir: cannot create directory '${p}': No such file or directory`);
        else if(bad)io.err(`mkdir: ${bad.toLowerCase()}`);
        else if(fs.kids(par.id).some(k=>k.name===nm)){if(!a.includes('-p'))io.err(`mkdir: cannot create directory '${p}': File exists`)}
        else fs.create(par.id,nm,'folder');
      });
    }},
    touch:{d:'Create empty files or update timestamps',u:'touch file...',run(a,io){
      if(!a.length){io.err('touch: missing file operand');return}
      a.forEach(p=>{
        const ex=fs.resolve(p,st.cwd);
        if(ex){ex.modified=Date.now();fs.save();return}
        const i=p.lastIndexOf('/'),dir=i>=0?p.slice(0,i)||'/':'.',nm=p.slice(i+1);
        const par=fs.resolve(dir,st.cwd);
        const bad=fs.validName(nm);
        if(!par||par.type!=='folder'||bad)io.err(`touch: cannot touch '${p}': No such file or directory`);
        else fs.create(par.id,nm,'file','');
      });
    }},
    rm:{d:'Remove files and directories',u:'rm [-r] [-f] path...',run(a,io){
      const flags=a.filter(x=>x.startsWith('-')).join(''),paths=a.filter(x=>!x.startsWith('-'));
      if(!paths.length){io.err('rm: missing operand');return}
      paths.forEach(p=>{
        if(p==='/'||p==='~'||p==='*'&&flags.includes('r')&&st.cwd==='root'){io.err(`rm: it is dangerous to operate recursively on '${p}'`);io.print('Nice try.','y');return}
        const n=fs.resolve(p,st.cwd);
        if(!n){if(!flags.includes('f'))io.err(`rm: cannot remove '${p}': No such file or directory`);return}
        if(SYSTEM_IDS.includes(n.id)){io.err(`rm: cannot remove '${p}': Operation not permitted`);return}
        if(n.type==='folder'&&!flags.includes('r')){io.err(`rm: cannot remove '${p}': Is a directory`);return}
        if(fs.isInside(st.cwd,n.id))st.cwd=n.parent||'root';
        fs.purge(n.id);renderPs();
      });
    }},
    mv:{d:'Move or rename files',u:'mv source destination',run(a,io){
      if(a.length<2){io.err('mv: missing file operand');return}
      const src=need(io,'mv',a[0]);
      if(!src)return;
      if(SYSTEM_IDS.includes(src.id)){io.err(`mv: cannot move '${a[0]}': Operation not permitted`);return}
      const dest=fs.resolve(a[1],st.cwd);
      if(dest&&dest.type==='folder'){
        if(src.id===dest.id||fs.isInside(dest.id,src.id)){io.err(`mv: cannot move '${a[0]}' into itself`);return}
        fs.move(src.id,dest.id);return;
      }
      const i=a[1].lastIndexOf('/'),dir=i>=0?a[1].slice(0,i)||'/':'.',nm=a[1].slice(i+1);
      const par=fs.resolve(dir,st.cwd);
      if(!par||par.type!=='folder'){io.err(`mv: cannot move to '${a[1]}': No such file or directory`);return}
      if(dest){io.err(`mv: '${a[1]}' already exists`);return}
      if(par.id!==src.parent&&(src.id===par.id||fs.isInside(par.id,src.id))){io.err(`mv: cannot move '${a[0]}' into itself`);return}
      if(par.id!==src.parent)fs.move(src.id,par.id);
      const err=fs.rename(src.id,nm);
      if(err)io.err('mv: '+err.toLowerCase());
    }},
    cp:{d:'Copy files and directories',u:'cp [-r] source destination',run(a,io){
      const paths=a.filter(x=>!x.startsWith('-')),rec=a.some(x=>x.startsWith('-')&&x.includes('r'));
      if(paths.length<2){io.err('cp: missing file operand');return}
      const src=need(io,'cp',paths[0]);
      if(!src)return;
      if(src.type==='folder'&&!rec){io.err(`cp: -r not specified; omitting directory '${paths[0]}'`);return}
      const dest=fs.resolve(paths[1],st.cwd);
      if(dest&&dest.type==='folder'){
        if(src.id===dest.id||fs.isInside(dest.id,src.id)){io.err(`cp: cannot copy '${paths[0]}' into itself`);return}
        fs.copy(src.id,dest.id);return;
      }
      const i=paths[1].lastIndexOf('/'),dir=i>=0?paths[1].slice(0,i)||'/':'.',nm=paths[1].slice(i+1);
      const par=fs.resolve(dir,st.cwd);
      if(!par||par.type!=='folder'||dest){io.err(`cp: cannot create '${paths[1]}'`);return}
      if(src.type==='folder'&&(src.id===par.id||fs.isInside(par.id,src.id))){io.err(`cp: cannot copy '${paths[0]}' into itself`);return}
      const c=fs.copy(src.id,par.id);
      const err=fs.rename(c.id,nm);
      if(err)io.err('cp: '+err.toLowerCase());
    }},
    tree:{d:'Show a directory tree',u:'tree [path]',run(a,io){
      const n=need(io,'tree',a[0]||'.');
      if(!n)return;
      const lines=[n.id==='root'?'~':n.name];
      let dirs=0,files=0;
      const walk=(id,prefix)=>{
        const k=fs.kids(id);
        k.forEach((c,i)=>{
          const last=i===k.length-1;
          lines.push(prefix+(last?'`-- ':'|-- ')+c.name+(c.type==='folder'?'/':''));
          if(c.type==='folder'){dirs++;walk(c.id,prefix+(last?'    ':'|   '))}else files++;
        });
      };
      if(n.type==='folder')walk(n.id,'');
      lines.push('');lines.push(`${dirs} directories, ${files} files`);
      io.html(lines.map((l,i)=>i===0?`<span class="d">${esc(l)}</span>`:esc(l)).join('\n'),lines.join('\n'));
    }},
    history:{d:'Show command history',u:'history',run(a,io){
      io.print(st.hist.map((c,i)=>String(i+1).padStart(4)+'  '+c).join('\n'));
    }},
    neofetch:{d:'Show system information',u:'neofetch',run(a,io){
      const logoLines=['   .----------.','   |  o o     |','   |  --------'+"'"+'--.',"   '--|  o o     |",'      |          |',"      '----------'"];
      const files=Object.values(fs.nodes).filter(n=>n.type==='file'&&!fs.isTrashed(n.id)).length;
      const info=[
        `<span class="pu">${esc(user())}</span>@<span class="pu">desktop</span>`,
        '-'.repeat(user().length+8),
        `<span class="pu">OS</span>: DESKTOP 1.0`,
        `<span class="pu">Host</span>: ${esc(navigator.platform||'Browser')}`,
        `<span class="pu">Kernel</span>: JavaScript`,
        `<span class="pu">Uptime</span>: ${Math.floor((Date.now()-st.start)/60000)} mins`,
        `<span class="pu">Shell</span>: dsh 1.0`,
        `<span class="pu">Resolution</span>: ${innerWidth}x${innerHeight}`,
        `<span class="pu">Theme</span>: ${resolvedTheme()==='dark'?'Dark':'Light'} (${esc(S.accent)})`,
        `<span class="pu">Windows</span>: ${wm.list.length} open`,
        `<span class="pu">Files</span>: ${files}   <span class="pu">Notes</span>: ${notes.length}`
      ];
      const cols=['#e5575d','#f09a45','#f2cc7a','#43b581','#2fb7c4','#4f8cff','#8b7cf6','#ec6aa6'];
      const sw=cols.map(c=>`<span class="sw" style="background:${c}"></span>`).join('');
      line(`<div class="nf"><pre class="pu">${logoLines.map(esc).join('\n')}</pre><pre>${info.join('\n')}\n\n${sw}</pre></div>`);
    }},
    theme:{d:'Switch between dark, light and system themes',u:'theme [dark|light|system|toggle]',run(a,io){
      const v=a[0];
      if(!v){io.print('current theme: '+S.theme+' ('+resolvedTheme()+')');return}
      if(v==='toggle')toggleTheme();
      else if(['dark','light','system'].includes(v))setS({theme:v});
      else io.err('theme: choose dark, light, system or toggle');
    }},
    accent:{d:'Change the accent color',u:'accent <name|#hex>  (purple blue pink green orange red teal)',run(a,io){
      const v=(a[0]||'').toLowerCase();
      if(!v){io.print('current accent: '+S.accent);io.print('available: '+Object.keys(ACCENTS).join(', '),'dim');return}
      const hex=ACCENTS[v]||(/^#?[0-9a-f]{6}$/i.test(v)?(v[0]==='#'?v:'#'+v):null);
      if(!hex)io.err('accent: unknown color '+v);
      else setS({accent:hex});
    }},
    wallpaper:{d:'List or change the wallpaper',u:'wallpaper [list|name]',run(a,io){
      const v=(a[0]||'list').toLowerCase();
      if(v==='list'){io.print(WALLPAPERS.map(w=>(w.id===S.wallpaper?'* ':'  ')+w.id).join('\n'));return}
      const w=WALLPAPERS.find(x=>x.id===v||x.name.toLowerCase()===v);
      if(!w)io.err('wallpaper: unknown wallpaper '+v);
      else setS({wallpaper:w.id});
    }},
    open:{d:'Open an application, file or folder',u:'open <app|path>',run(a,io){
      if(!a[0]){io.err('open: missing operand');return}
      const k=a[0].toLowerCase();
      if(APPS[k]&&k!=='trash'&&k!=='editor'){wm.open(k);return}
      const n=fs.resolve(a[0],st.cwd);
      if(n)openNode(n);
      else io.err(`open: ${a[0]}: not an app or path. Apps: ${PINNED.join(', ')}`);
    }},
    ps:{d:'List open windows',u:'ps',run(a,io){
      const rows=wm.list.map((w,i)=>`${String(1000+i).padStart(5)}  ${w.app.padEnd(11)} ${w.min?'minimized':'running  '}  ${w.title}`);
      io.print('  PID  APP         STATE      TITLE\n'+rows.join('\n'));
    }},
    kill:{d:'Close a window by PID (see ps)',u:'kill <pid>',run(a,io){
      const pid=parseInt(a[0]);
      const w=wm.list[pid-1000];
      if(!w){io.err(`kill: (${a[0]||''}) - No such process`);return}
      if(w===win){io.print('Closing this terminal...');setTimeout(()=>win.close(),250);return}
      wm.close(w);
    }},
    lock:{d:'Lock the screen',u:'lock',run(){sysAction('lock')}},
    reboot:{d:'Restart DESKTOP',u:'reboot',run(){setTimeout(()=>sysAction('restart'),300)}},
    shutdown:{d:'Shut down DESKTOP',u:'shutdown',run(){setTimeout(()=>sysAction('off'),300)}},
    exit:{d:'Close this terminal',u:'exit',run(){win.close()}},
    cowsay:{d:'Make a cow say something',u:'cowsay [text]',run(a,io){
      const t=a.join(' ')||'Moo.';
      const bar='-'.repeat(t.length+2);
      io.print(` ${bar}\n< ${t} >\n ${bar}\n        \\   ^__^\n         \\  (oo)\\_______\n            (__)\\       )\\/\\\n                ||----w |\n                ||     ||`);
    }},
    fortune:{d:'Print a random saying',u:'fortune',run(a,io){io.print(FORTUNES[Math.floor(Math.random()*FORTUNES.length)])}},
    sudo:{d:'Execute a command as another user',u:'sudo command',run(a,io){
      if(a.join(' ').toLowerCase()==='make me a sandwich')io.print('Okay.','ok');
      else{io.err(`${user()} is not in the sudoers file. This incident will be reported.`)}
    }},
    matrix:{d:'Follow the white rabbit',u:'matrix',run(a,io){io.print('Wake up, '+user()+'...','ok');startMatrix()}},
    ping:{d:'Send test packets to a host',u:'ping <host>',async run(a,io){
      const host=a[0];
      if(!host){io.err('ping: usage error: destination address required');return}
      if(!S.wifi){io.err('ping: connect: Network is unreachable');return}
      io.print(`PING ${host} (203.0.113.${1+Math.floor(Math.random()*200)}) 56 data bytes`);
      const times=[];
      for(let i=0;i<4;i++){
        await sleep(650);
        if(st.abort)return;
        const t=12+Math.random()*28;times.push(t);
        io.print(`64 bytes from ${host}: icmp_seq=${i+1} ttl=57 time=${t.toFixed(1)} ms`);
      }
      const avg=times.reduce((x,y)=>x+y,0)/4;
      io.print(`\n--- ${host} ping statistics ---\n4 packets transmitted, 4 received, 0% packet loss\nrtt min/avg/max = ${Math.min(...times).toFixed(1)}/${avg.toFixed(1)}/${Math.max(...times).toFixed(1)} ms`);
    }},
    hack:{d:'Break into the mainframe',u:'hack',async run(a,io){
      const steps=['Resolving mainframe.local','Bypassing firewall','Injecting packets','Decrypting handshake','Escalating privileges'];
      for(const s of steps){
        await sleep(520);
        if(st.abort)return;
        io.print(`[${'#'.repeat(10)}] ${s}... done`,'ok');
      }
      await sleep(600);
      io.print('ACCESS GRANTED','y');
      await sleep(700);
      io.print('Just kidding. Nothing was touched.','dim');
    }}
  };
  CMDS.man=CMDS.help;
  CMDS.dir=CMDS.ls;

  async function exec(raw){
    let toks=tokenize(raw.trim());
    if(!toks.length)return;
    toks=toks.map(t=>expand(t));
    let redir=null,rpath=null;
    const gi=toks.findIndex(t=>t==='>'||t==='>>');
    if(gi>=0){redir=toks[gi];rpath=toks[gi+1];toks=toks.slice(0,gi).concat(toks.slice(gi+2))}
    const name=toks[0],args=toks.slice(1);
    const cmd=CMDS[name];
    if(!cmd){line(esc(`dsh: command not found: ${name}`),'e');return}
    if(redir){
      if(!rpath){line('dsh: parse error: expected file name after '+redir,'e');return}
      const buf=[];
      await cmd.run(args,mkio(buf));
      const text=buf.join('\n')+(buf.length?'\n':'');
      const ex=fs.resolve(rpath,st.cwd);
      if(ex&&ex.type==='folder'){line(esc(`dsh: ${rpath}: Is a directory`),'e');return}
      if(ex){ex.content=(redir==='>>'?ex.content:'')+text;ex.modified=Date.now();fs.save()}
      else{
        const i=rpath.lastIndexOf('/'),dir=i>=0?rpath.slice(0,i)||'/':'.',nm=rpath.slice(i+1);
        const par=fs.resolve(dir,st.cwd);
        if(!par||par.type!=='folder'||fs.validName(nm)){line(esc(`dsh: cannot create ${rpath}`),'e');return}
        fs.create(par.id,nm,'file',text);
      }
      return;
    }
    await cmd.run(args,mkio(null));
  }
  async function submit(){
    const raw=inp.value;
    line(`<span class="u">${esc(user())}@desktop</span>:<span class="p">${esc(cwdPath())}</span>$ ${esc(raw)}`);
    inp.value='';
    if(raw.trim()){
      if(st.hist[st.hist.length-1]!==raw)st.hist.push(raw);
      st.hist=st.hist.slice(-100);
      store.set('term.history',st.hist);
    }
    st.hi=null;
    st.busy=true;st.abort=false;
    $('.tm-line',win.body).style.visibility='hidden';
    try{await exec(raw)}catch(e){line(esc('dsh: error: '+e.message),'e')}
    st.busy=false;
    $('.tm-line',win.body).style.visibility='';
    renderPs();
    inp.focus();
    tm.scrollTop=tm.scrollHeight;
  }
  function complete(){
    const pos=inp.selectionStart,before=inp.value.slice(0,pos),after=inp.value.slice(pos);
    const parts=before.split(/(?<!\\)\s+/);
    const last=parts[parts.length-1],first=parts.length===1;
    const plain=last.replace(/\\(.)/g,'$1');
    let cands=[];
    if(first)cands=Object.keys(CMDS).filter(c=>c.startsWith(plain));
    else{
      const slash=plain.lastIndexOf('/'),dirPart=slash>=0?plain.slice(0,slash+1):'',namePart=plain.slice(slash+1);
      const dir=fs.resolve(dirPart||'.',st.cwd);
      if(dir&&dir.type==='folder')cands=fs.kids(dir.id).filter(k=>k.name.toLowerCase().startsWith(namePart.toLowerCase())).map(k=>dirPart+k.name+(k.type==='folder'?'/':''));
    }
    if(!cands.length)return;
    const escp=s=>s.replace(/ /g,'\\ ');
    const head=before.slice(0,before.length-last.length);
    if(cands.length===1){
      const c=cands[0];
      const v=head+escp(c)+(c.endsWith('/')?'':' ');
      inp.value=v+after;inp.setSelectionRange(v.length,v.length);return;
    }
    let pre=cands[0];
    cands.forEach(c=>{while(!c.toLowerCase().startsWith(pre.toLowerCase()))pre=pre.slice(0,-1)});
    if(pre.length>plain.length){const v=head+escp(pre);inp.value=v+after;inp.setSelectionRange(v.length,v.length)}
    else line(`<span class="u">${esc(user())}@desktop</span>:<span class="p">${esc(cwdPath())}</span>$ ${esc(inp.value)}\n`+cands.map(c=>esc(c)).join('  '));
  }
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();submit()}
    else if(e.key==='ArrowUp'){
      e.preventDefault();
      if(!st.hist.length)return;
      st.hi=st.hi===null?st.hist.length-1:Math.max(0,st.hi-1);
      inp.value=st.hist[st.hi];
    }else if(e.key==='ArrowDown'){
      e.preventDefault();
      if(st.hi===null)return;
      st.hi++;
      if(st.hi>=st.hist.length){st.hi=null;inp.value=''}else inp.value=st.hist[st.hi];
    }else if(e.key==='Tab'){e.preventDefault();complete()}
    else if(e.ctrlKey&&e.key.toLowerCase()==='l'){e.preventDefault();out.innerHTML=''}
    else if(e.ctrlKey&&e.key.toLowerCase()==='c'){
      e.preventDefault();
      line(`<span class="u">${esc(user())}@desktop</span>:<span class="p">${esc(cwdPath())}</span>$ ${esc(inp.value)}^C`);
      inp.value='';
    }
  });
  const abortKey=e=>{
    if(st.busy&&e.ctrlKey&&e.key.toLowerCase()==='c'&&wm.active===win){st.abort=true;line('^C','dim')}
  };
  document.addEventListener('keydown',abortKey);
  win.onClose(()=>{st.abort=true;document.removeEventListener('keydown',abortKey)});
  tm.addEventListener('click',()=>{if(!String(getSelection()))inp.focus()});
  const last=store.get('term.last',null);
  line('<span class="pu">DESKTOP Terminal 1.0</span>');
  line('Type <span class="hl">help</span> to see the available commands.','dim');
  if(last)line('Last login: '+esc(last),'dim');
  store.set('term.last',new Date().toLocaleString());
  line('');
  renderPs();
  setTimeout(()=>inp.focus(),80);
}};

APP_IMPL.calculator={w:340,h:560,minW:300,minH:460,single:true,create(win){
  win.body.innerHTML=`<div class="ca"><div class="ca-disp"><button class="ibtn ca-hb" data-k="hist" title="History">${icon('history',18)}</button><div class="ca-expr"></div><div class="ca-val">0</div></div><div class="ca-pad"></div><div class="ca-hist"><div class="ca-hh"><span>History</span><div><button class="btn" data-k="hclear">Clear</button> <button class="ibtn" data-k="hclose" title="Close" style="display:inline-grid;vertical-align:middle">${icon('x',16)}</button></div></div><div class="ca-hl"></div></div></div>`;
  const pad=$('.ca-pad',win.body),valEl=$('.ca-val',win.body),exprEl=$('.ca-expr',win.body),histEl=$('.ca-hist',win.body),hl=$('.ca-hl',win.body);
  const keys=[['C','c','C'],['bs','','bs'],['%','','%'],['÷','o','÷'],['7','n','7'],['8','n','8'],['9','n','9'],['×','o','×'],['4','n','4'],['5','n','5'],['6','n','6'],['-','o','-'],['1','n','1'],['2','n','2'],['3','n','3'],['+','o','+'],['neg','','neg'],['0','n','0'],['.','n','.'],['=','eq','=']];
  pad.innerHTML=keys.map(k=>`<button class="ck ${k[1]}" data-k="${k[0]}">${k[0]==='bs'?icon('backspace',22):k[0]==='neg'?'+/-':k[0]}</button>`).join('');
  let cur='0',prev=null,op=null,fresh=true,err=false,expr='',lastOp=null,lastVal=null;
  let hist=store.get('calc.hist',[]);
  const fmt=v=>!isFinite(v)?'Error':String(parseFloat(v.toPrecision(12)));
  const disp=s=>{
    if(s==='Error'||s.includes('e'))return s;
    const neg=s.startsWith('-');
    const parts=s.replace('-','').split('.');
    const i=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');
    return (neg?'-':'')+i+(parts[1]!==undefined?'.'+parts[1]:'');
  };
  function calc(a,b,o){
    if(o==='+')return a+b;
    if(o==='-')return a-b;
    if(o==='×')return a*b;
    if(b===0)return NaN;
    return a/b;
  }
  function paint(){
    const t=err?'Cannot divide by zero':disp(cur);
    valEl.textContent=t;
    valEl.style.fontSize=t.length>16?'26px':t.length>12?'32px':t.length>9?'38px':'46px';
    exprEl.textContent=expr;
  }
  function saveHist(e,r){
    hist.unshift({e,r});hist=hist.slice(0,40);
    store.set('calc.hist',hist);
    renderHist();
  }
  function renderHist(){
    hl.innerHTML=hist.length?hist.map((x,i)=>`<button class="ca-hi" data-h="${i}"><span>${esc(x.e)}</span><b>${esc(disp(x.r))}</b></button>`).join(''):'<div class="empty-note" style="text-align:center">No calculations yet</div>';
  }
  function finish(res){
    if(!isFinite(res)){err=true;cur='0';fresh=true;op=null;prev=null;return false}
    cur=fmt(res);
    if(res===1337)toast({title:'Elite.',msg:'1337 detected.',icon:'check'});
    else if(res===42)toast({title:'The answer',msg:'To life, the universe and everything.',icon:'info'});
    return true;
  }
  function press(k){
    if(err&&k!=='C'&&k!=='hist'){err=false;cur='0';expr=''}
    if(/^\d$/.test(k)){
      if(fresh){cur=k;fresh=false}
      else if(cur==='0')cur=k;
      else if(cur.replace(/[-.]/g,'').length<15)cur+=k;
    }else if(k==='.'){
      if(fresh){cur='0.';fresh=false}
      else if(!cur.includes('.'))cur+='.';
    }else if(k==='+'||k==='-'||k==='×'||k==='÷'){
      if(op&&!fresh){
        const r=calc(prev,parseFloat(cur),op);
        if(!finish(r)){expr='';paint();return}
        prev=r;
      }else prev=parseFloat(cur);
      op=k;fresh=true;lastOp=null;
      expr=disp(fmt(prev))+' '+k;
    }else if(k==='='){
      if(op){
        const b=parseFloat(cur),a=prev,o=op;
        const r=calc(a,b,o);
        const e=`${disp(fmt(a))} ${o} ${disp(fmt(b))} =`;
        if(finish(r)){expr=e;saveHist(e,cur);lastOp=o;lastVal=b}
        else expr='';
        op=null;prev=null;fresh=true;
      }else if(lastOp){
        const a=parseFloat(cur),r=calc(a,lastVal,lastOp);
        const e=`${disp(fmt(a))} ${lastOp} ${disp(fmt(lastVal))} =`;
        if(finish(r)){expr=e;saveHist(e,cur)}
        fresh=true;
      }
    }else if(k==='C'){
      cur='0';prev=null;op=null;fresh=true;err=false;expr='';lastOp=null;lastVal=null;
    }else if(k==='bs'){
      if(fresh)return;
      cur=cur.length>1&&!(cur.length===2&&cur[0]==='-')?cur.slice(0,-1):'0';
    }else if(k==='neg'){
      if(cur!=='0'&&cur!=='0.')cur=cur.startsWith('-')?cur.slice(1):'-'+cur;
    }else if(k==='%'){
      const v=parseFloat(cur);
      cur=fmt(op&&prev!==null?prev*v/100:v/100);
      fresh=true;
    }
    paint();
  }
  win.body.addEventListener('click',e=>{
    const b=e.target.closest('[data-k]');
    if(b){
      const k=b.dataset.k;
      if(k==='hist'){histEl.classList.toggle('open')}
      else if(k==='hclose')histEl.classList.remove('open');
      else if(k==='hclear'){hist=[];store.set('calc.hist',hist);renderHist()}
      else press(k);
      return;
    }
    const hi=e.target.closest('[data-h]');
    if(hi){cur=hist[+hi.dataset.h].r;fresh=true;err=false;histEl.classList.remove('open');paint()}
  });
  const onKey=e=>{
    if(wm.active!==win||e.ctrlKey||e.metaKey||e.altKey)return;
    if(e.target.closest&&e.target.closest('input,textarea'))return;
    const k=e.key;
    let m=null;
    if(/^\d$/.test(k)||k==='.')m=k;
    else if(k==='+'||k==='-')m=k;
    else if(k==='*'||k==='x'||k==='X')m='×';
    else if(k==='/')m='÷';
    else if(k==='Enter'||k==='=')m='=';
    else if(k==='Backspace')m='bs';
    else if(k==='Escape'||k==='Delete')m='C';
    else if(k==='%')m='%';
    if(m){e.preventDefault();press(m)}
  };
  document.addEventListener('keydown',onKey);
  win.onClose(()=>document.removeEventListener('keydown',onKey));
  renderHist();paint();
}};
</script>
<script>
addStyle(`
.mu{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);height:100%;container-type:inline-size}
.mu-now{padding:22px 24px;display:flex;flex-direction:column;gap:14px;min-width:0;border-right:1px solid var(--border)}

.mu-viz{width:100%;height:54px;display:block}

.mu-ctl{display:flex;align-items:center;justify-content:center;gap:10px}

.mu-play{width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;transition:transform .12s,filter .15s;box-shadow:0 6px 18px rgba(var(--accent-rgb),.4)}

const mp={ctx:null,master:null,analyser:null,send:null,noise:null,bus:null,dry:null,timer:null,idx:clamp(store.get('music.idx',0),0,TRACKS.length-1),playing:false,startPos:0,startCtx:0,step:0,nextT:0,shuffle:store.get('music.shuffle',false),repeat:store.get('music.repeat','off')};
const mtof=m=>440*Math.pow(2,(m-69)/12);
const hash=(n,seed)=>{const x=Math.sin(n*127.1+seed*311.7)*43758.5453;return x-Math.floor(x)};
const degNote=(tr,deg)=>{const l=tr.scale.length;return tr.root+tr.scale[((deg%l)+l)%l]+12*Math.floor(deg/l)};
const fmtTime=s=>{s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+pad2(s%60)};
function mpCtx(){
  if(mp.ctx)return mp.ctx;

  const master=ctx.createGain(),comp=ctx.createDynamicsCompressor(),an=ctx.createAnalyser();
  an.fftSize=256;an.smoothingTimeConstant=.8;
  master.connect(comp);comp.connect(an);an.connect(ctx.destination);

  send.gain.value=.3;dl.delayTime.value=.34;fb.gain.value=.38;lp.type='lowpass';lp.frequency.value=2200;
  send.connect(dl);dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(master);
  const nb=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate),d=nb.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;

  applyVolume();
  return ctx;
}
function applyVolume(){
  if(!mp.master)return;
  mp.master.gain.setTargetAtTime(S.muted?0:Math.pow(S.volume/100,1.5)*.9,mp.ctx.currentTime,.02);
}
bus.on('settings',p=>{if(p&&('volume' in p||'muted' in p))applyVolume()});
function envelope(g,t,a,peak,hold,rel){
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(peak,t+a);
  g.gain.setValueAtTime(peak,t+a+hold);
  g.gain.exponentialRampToValueAtTime(.0001,t+a+hold+rel);
  return t+a+hold+rel;
}
function voice(type,freq,t,hold,peak,o){
  o=o||{};
  const ctx=mp.ctx,osc=ctx.createOscillator(),g=ctx.createGain();
  osc.type=type;osc.frequency.value=freq;
  if(o.det)osc.detune.value=o.det;
  if(o.cut){const f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=o.cut;osc.connect(f);f.connect(g)}else osc.connect(g);

function noiseHit(t,type,freq,q,peak,dur){
  const ctx=mp.ctx,src=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();

function kick(t){

  o.connect(g);g.connect(mp.dry);o.start(t);o.stop(t+.32);

function playStep(tr,step,t){
  const sd=60/tr.bpm/2,pos=step%8,bar=Math.floor(step/8),chord=tr.prog[bar%tr.prog.length];
  const padWave=tr.wave==='sine'?'triangle':tr.wave;
  if(pos===0){
    [0,2,4].forEach((k,i)=>{
      const f=mtof(degNote(tr,chord+k));
      voice(padWave,f,t,sd*5.5,.04,{a:.7,rel:1.1,cut:1000,det:i%2?8:-8});
      voice('sine',f,t,sd*5.5,.03,{a:.8,rel:1.1});
    });
  }
  if(pos===0||pos===4||(pos===6&&hash(step,tr.seed)>.55)){
    const f=mtof(degNote(tr,chord-7));
    voice('sine',f,t,sd*(pos===0?2.6:1.2),.22,{a:.02,rel:.3});
    voice('triangle',f,t,sd*(pos===0?2.6:1.2),.07,{a:.02,rel:.25,cut:700});
  }
  if(hash(step*3+1,tr.seed)>.3){
    const picks=[0,2,4,7,9,11],k=picks[Math.floor(hash(step+5,tr.seed)*picks.length)];
    const f=mtof(degNote(tr,chord+k)+12),acc=pos%2===0?1:.7;

    voice('sine',f*2,t,0,.022*acc,{a:.004,rel:sd*1.4});
  }
  if(tr.drums){
    if(pos%4===0)kick(t);
    if(pos===4){noiseHit(t,'bandpass',1900,.8,.2,.16)}
    if(pos%2===1)noiseHit(t,'highpass',7500,.7,pos%4===3?.07:.045,.05);
  }
}
function mpSchedule(){
  const tr=TRACKS[mp.idx],sd=60/tr.bpm/2,total=Math.floor(tr.dur/sd);
  while(mp.bus&&mp.nextT<mp.ctx.currentTime+.3){
    if(mp.step>=total)break;
    playStep(tr,mp.step,mp.nextT);
    mp.step++;mp.nextT+=sd;
  }

function mpKill(){
  clearInterval(mp.timer);mp.timer=null;
  if(mp.bus){
    const b=mp.bus,d=mp.dry,t=mp.ctx.currentTime;
    b.gain.setTargetAtTime(0,t,.03);d.gain.setTargetAtTime(0,t,.03);
    setTimeout(()=>{try{b.disconnect();d.disconnect()}catch(e){}},500);
    mp.bus=null;mp.dry=null;
  }
}
function mpPos(){
  if(!mp.playing)return mp.startPos;
  return clamp(mp.startPos+Math.max(0,mp.ctx.currentTime-mp.startCtx),0,TRACKS[mp.idx].dur);
}
function mpStart(pos){
  const ctx=mpCtx();
  ctx.resume();
  mpKill();
  const tr=TRACKS[mp.idx],sd=60/tr.bpm/2;
  mp.bus=ctx.createGain();mp.bus.connect(mp.master);mp.bus.connect(mp.send);
  mp.dry=ctx.createGain();mp.dry.connect(mp.master);
  mp.startPos=pos;mp.startCtx=ctx.currentTime+.06;
  mp.step=Math.ceil(pos/sd-1e-6);
  mp.nextT=mp.startCtx+(mp.step*sd-pos);
  mp.playing=true;
  mp.timer=setInterval(mpSchedule,50);
  mpSchedule();
  mpEmit();

function mpPause(){
  if(mp.playing){mp.startPos=mpPos();mp.playing=false;mpKill()}
  mpEmit();
}
function mpToggle(){mp.playing?mpPause():mpStart(mp.startPos)}
function mpSet(i,play){
  mp.idx=(i+TRACKS.length)%TRACKS.length;
  store.set('music.idx',mp.idx);
  mp.startPos=0;
  if(play)mpStart(0);
  else{mp.playing=false;mpKill();mpEmit()}
}
function mpNext(){
  let n=mp.idx+1;
  if(mp.shuffle){do{n=Math.floor(Math.random()*TRACKS.length)}while(n===mp.idx&&TRACKS.length>1)}
  mpSet(n,true);
}
function mpPrev(){
  if(mpPos()>3){mp.playing?mpStart(0):(mp.startPos=0,mpEmit())}
  else mpSet(mp.idx-1,true);
}
function mpSeek(s){
  s=clamp(s,0,TRACKS[mp.idx].dur-.5);
  if(mp.playing)mpStart(s);else{mp.startPos=s;mpEmit()}
}
function mpEmit(){
  const tr=TRACKS[mp.idx];
  bus.emit('music',{playing:mp.playing,title:tr.title,artist:tr.artist});
  bus.emit('music:ui');
}
setInterval(()=>{
  if(mp.playing){
    const tr=TRACKS[mp.idx];
    if(mpPos()>=tr.dur-.08){
      if(mp.repeat==='one')mpStart(0);
      else if(mp.repeat==='all'||mp.shuffle||mp.idx<TRACKS.length-1)mpNext();
      else{mp.startPos=0;mp.playing=false;mpKill();mpEmit()}
      return;
    }
  }
  bus.emit('music:tick');

APP_IMPL.music={w:840,h:520,minW:340,minH:380,single:true,create(win){
